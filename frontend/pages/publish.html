<!DOCTYPE html>
<!-- ============================================================
     页面：发布管理页 (publish.html)
     用途：管理看板实例（创建/编辑/删除/发布/下架）和展示终端
           （注册/编辑/删除），终端支持绑定看板实例。
     所属项目：智能工厂设备监控看板
     依赖：base.css / layout.css / components.css / responsive.css
           Font Awesome CDN
           utils.js / api.js / app.js
     ============================================================ -->
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布管理 - 设备监控看板</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    /* ===== 发布管理页专属样式 ===== */
    .page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
    .page-title { font-size:24px; font-weight:600; color:var(--text-primary); }
    .instance-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:16px; }  /* 看板实例卡片网格 */
    .instance-card {
      background:var(--bg-card); border:1px solid var(--border-color); border-radius:12px; padding:20px;
    }
    .instance-card:hover { border-color:var(--color-primary); }  /* 悬停高亮边框 */
    .instance-card .card-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
    .instance-card .card-title { font-size:16px; font-weight:600; color:var(--text-primary); }
    .instance-card .card-desc { font-size:13px; color:var(--text-secondary); margin-bottom:12px; }  /* 实例描述文本 */
    .instance-card .card-meta { display:flex; gap:12px; font-size:12px; color:var(--text-secondary); flex-wrap:wrap; }  /* 元信息行 */
    .instance-card .card-meta span { display:flex; align-items:center; gap:4px; }
    .instance-card .status-badge {  /* 实例状态徽章 */
      display:inline-block; padding:2px 10px; border-radius:10px; font-size:11px;
    }
    .status-badge.published { background:rgba(0,230,118,0.15); color:#00e676; }  /* 已发布 → 绿色 */
    .status-badge.draft { background:rgba(255,215,64,0.15); color:#ffd740; }     /* 草稿 → 黄色 */
    .status-badge.offline { background:rgba(84,110,122,0.15); color:#546e7a; }   /* 已下架 → 灰色 */
    .instance-card .card-actions { display:flex; gap:6px; margin-top:12px; padding-top:12px; border-top:1px solid var(--border-light); flex-wrap:wrap; }  /* 操作按钮区 */
    .instance-card .card-actions button { flex:1; min-width:80px; padding:6px; border-radius:6px; font-size:12px; cursor:pointer; }

    /* 展示终端卡片网格 */
    .terminal-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; margin-top:12px; }
    .inst-select-item:hover { border-color:var(--color-primary) !important; background:rgba(108,63,245,0.06) !important; }
    .terminal-card {
      background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:8px; padding:14px;
    }
    .terminal-card .tc-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .terminal-card .tc-name { font-size:14px; font-weight:500; color:var(--text-primary); }  /* 终端用户名称 */
    .section-title { font-size:18px; font-weight:600; color:var(--text-primary); margin-bottom:16px; margin-top:32px; display:flex; align-items:center; gap:8px; }
    .section-title:first-child { margin-top:0; }
    .empty-state { text-align:center; padding:40px 20px; color:var(--text-secondary); }  /* 空状态占位 */
    .empty-state i { font-size:36px; margin-bottom:12px; opacity:0.3; }

    /* Tab 切换 */
    .tabs { display:flex; gap:4px; margin-bottom:20px; background:var(--bg-secondary); border-radius:8px; padding:4px; width:fit-content; }
    .tab-btn { padding:8px 20px; border:none; background:transparent; border-radius:6px; color:var(--text-secondary); cursor:pointer; font-size:14px; }
    .tab-btn.active { background:var(--color-primary); color:#fff; }  /* 选中 Tab */
  </style>
</head>
<body>
  <div id="pageLoader" style="position:fixed;inset:0;z-index:99999;background:#0a0e17;display:flex;align-items:center;justify-content:center;transition:opacity 0.5s;">
    <div style="width:200px;text-align:center;"><div style="width:36px;height:36px;border:3px solid rgba(108,63,245,0.3);border-top-color:#6C3FF5;border-radius:50%;animation:loaderSpin 0.8s linear infinite;margin:0 auto 12px;"></div><div style="color:#6a7588;font-size:13px;">加载中...</div></div>
  </div>
  <style>@keyframes loaderSpin{to{transform:rotate(360deg)}}#pageLoader.hide{opacity:0;pointer-events:none}</style>

  <div id="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand"><i class="fas fa-cubes"></i> 智能看板</div>
      <nav class="sidebar-nav">
        <a href="../index.html" class="nav-item" data-page="dashboard">
          <img src="../assets/icons/dashboard.svg" class="nav-icon">
          <span class="nav-text">总览看板</span>
        </a>
        <a href="detail.html" class="nav-item" data-page="detail">
          <img src="../assets/icons/device.svg" class="nav-icon">
          <span class="nav-text">设备管理</span>
        </a>
        <a href="alarms.html" class="nav-item" data-page="alarms">
          <img src="../assets/icons/alarm.svg" class="nav-icon">
          <span class="nav-text">告警管理</span>
          <span class="nav-badge" id="alarmBadge" style="display:none;">0</span>
        </a>
        <a href="personnel.html" class="nav-item" data-page="personnel">
          <img src="../assets/icons/user.svg" class="nav-icon">
          <span class="nav-text">人员管理</span>
        </a>
        <a href="templates.html" class="nav-item" data-page="templates">
          <img src="../assets/icons/template.svg" class="nav-icon">
          <span class="nav-text">看板模板</span>
        </a>
        <a href="publish.html" class="nav-item active" data-page="publish">
          <img src="../assets/icons/publish.svg" class="nav-icon">
          <span class="nav-text">发布管理</span>
        </a>
        <a href="settings.html" class="nav-item" data-page="settings">
          <img src="../assets/icons/settings.svg" class="nav-icon">
          <span class="nav-text">系统设置</span>
        </a>
      </nav>
      <div class="sidebar-footer"><div class="clock" id="headerClock">--:--:--</div></div>
    </aside>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <main id="mainContent" class="main-content">
      <div class="top-bar">
        <button id="sidebarToggle" class="top-bar__btn"><i class="fas fa-bars"></i></button>
        <div class="top-bar__title">看板发布管理</div>
        <div class="top-bar__actions">
          <button id="refreshBtn" class="top-bar__btn" title="刷新"><i class="fas fa-sync-alt"></i></button>
          <button id="topThemeBtn" class="top-bar__btn" title="切换主题"><i class="fas fa-moon"></i></button>
        </div>
      </div>

      <div class="page-content">
        <div class="tabs">
          <button class="tab-btn active" data-tab="instances">看板实例</button>
          <button class="tab-btn" data-tab="terminals">展示终端</button>
        </div>

        <!-- 看板实例 -->
        <div id="tabInstances">
          <div class="page-header">
            <span class="page-title">看板实例 <span class="badge" id="instanceCount"></span></span>
            <button id="createInstanceBtn" class="btn-save"><i class="fas fa-plus"></i> 新建实例</button>
          </div>
          <div id="instanceList">
            <div class="empty-state" id="instanceEmpty"><i class="fas fa-clipboard-list"></i><p>暂无看板实例</p></div>
            <div class="instance-grid" id="instanceGrid" style="display:none;"></div>
          </div>
        </div>

        <!-- 展示终端 -->
        <div id="tabTerminals" style="display:none;">
          <div class="page-header">
            <span class="page-title">终端在线状态 <span class="badge" id="terminalCount"></span></span>
          </div>
          <div id="terminalList">
            <div class="empty-state" id="terminalEmpty"><i class="fas fa-desktop"></i><p>暂无已分配看板的员工</p></div>
            <div class="terminal-grid" id="terminalGrid" style="display:none;"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 新建实例模态框 -->
  <div id="instanceModal" style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;">
    <div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:24px;width:480px;max-width:90vw;">
      <h3 style="color:var(--text-primary);margin:0 0 16px 0;">新建看板实例</h3>
      <div style="display:grid;gap:12px;">
        <div>
          <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:4px;">选择模板 *</label>
          <select id="inst_template" style="width:100%;padding:10px 14px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);font-size:14px;"><option value="">加载中...</option></select>
        </div>
        <div>
          <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:4px;">实例名称 *</label>
          <input id="inst_name" style="width:100%;padding:10px 14px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);font-size:14px;box-sizing:border-box;" placeholder="如：一车间大屏看板">
        </div>
        <div>
          <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:4px;">刷新间隔（秒）</label>
          <input id="inst_interval" type="number" value="30" style="width:100%;padding:10px 14px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);font-size:14px;box-sizing:border-box;">
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
        <button id="inst_cancel" style="padding:10px 20px;border:1px solid var(--border-color);background:transparent;border-radius:8px;color:var(--text-secondary);cursor:pointer;font-size:14px;">取消</button>
        <button id="inst_save" style="padding:10px 20px;border:none;background:var(--color-primary,#6C3FF5);border-radius:8px;color:#fff;cursor:pointer;font-size:14px;">创建</button>
      </div>
    </div>
  </div>

  <!-- 注册终端模态框 -->
  <div id="terminalModal" style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;">
    <div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:24px;width:460px;max-width:90vw;">
      <h3 style="color:var(--text-primary);margin:0 0 16px 0;" id="terminalModalTitle">注册展示终端</h3>
      <div style="display:grid;gap:12px;">
        <div>
          <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:4px;">终端名称 *</label>
          <input id="tm_name" style="width:100%;padding:10px 14px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);font-size:14px;box-sizing:border-box;" placeholder="如：一车间大屏">
        </div>
        <div>
          <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:4px;">终端类型</label>
          <select id="tm_type" style="width:100%;padding:10px 14px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);font-size:14px;">
            <option value="large_screen">车间大屏</option>
            <option value="pc">PC浏览器</option>
            <option value="mobile">移动端</option>
          </select>
        </div>
        <div>
          <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:4px;">安装位置</label>
          <input id="tm_location" style="width:100%;padding:10px 14px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);font-size:14px;box-sizing:border-box;" placeholder="如：一车间东侧">
        </div>
        <div>
          <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:4px;">分辨率</label>
          <input id="tm_resolution" style="width:100%;padding:10px 14px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);font-size:14px;box-sizing:border-box;" placeholder="如：1920x1080">
        </div>
        <div id="tm_bind_section" style="display:none;">
          <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:4px;">绑定看板实例</label>
          <select id="tm_bind" style="width:100%;padding:10px 14px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);font-size:14px;"><option value="">不绑定</option></select>
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
        <button id="tm_cancel" style="padding:10px 20px;border:1px solid var(--border-color);background:transparent;border-radius:8px;color:var(--text-secondary);cursor:pointer;font-size:14px;">取消</button>
        <button id="tm_save" style="padding:10px 20px;border:none;background:var(--color-primary,#6C3FF5);border-radius:8px;color:#fff;cursor:pointer;font-size:14px;">注册</button>
      </div>
    </div>
  </div>

  <!-- 分配用户模态框 -->
  <div id="assignModal" style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;">
    <div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:24px;width:480px;max-width:90vw;">
      <h3 style="color:var(--text-primary);margin:0 0 4px 0;">分配看板给员工</h3>
      <p style="color:var(--text-secondary);font-size:13px;margin-bottom:16px;" id="assignDesc">选择可以查看此看板的员工：</p>
      <div id="assignUserList" style="max-height:300px;overflow-y:auto;display:grid;gap:6px;">
        <div style="color:var(--text-secondary);text-align:center;padding:24px;font-size:14px;">加载中...</div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
        <button id="assignCancel" style="padding:10px 20px;border:1px solid var(--border-color);background:transparent;border-radius:8px;color:var(--text-secondary);cursor:pointer;font-size:14px;">取消</button>
        <button id="assignSave" style="padding:10px 20px;border:none;background:var(--color-primary,#6C3FF5);border-radius:8px;color:#fff;cursor:pointer;font-size:14px;">保存分配</button>
      </div>
    </div>
  </div>

  <!-- 选择展示实例模态框 -->
  <div id="selectInstanceModal" style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;">
    <div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:24px;width:480px;max-width:90vw;">
      <h3 style="color:var(--text-primary);margin:0 0 4px 0;">选择展示看板</h3>
      <p style="color:var(--text-secondary);font-size:13px;margin-bottom:16px;" id="selInstDesc">请选择要在此终端上展示的看板实例：</p>
      <div id="selInstList" style="max-height:320px;overflow-y:auto;display:grid;gap:8px;">
        <div style="color:var(--text-secondary);text-align:center;padding:24px;font-size:14px;">加载中...</div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
        <button id="selInstCancel" style="padding:10px 20px;border:1px solid var(--border-color);background:transparent;border-radius:8px;color:var(--text-secondary);cursor:pointer;font-size:14px;">取消</button>
      </div>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script>
    // ============================================================
    // 数据缓存变量
    // ============================================================
    var instancesData = [];
    var terminalsData = [];

    // ============================================================
    // Tab 切换：看板实例 / 展示终端
    // ============================================================
    document.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
        var tab = this.dataset.tab;
        document.getElementById('tabInstances').style.display = tab === 'instances' ? 'block' : 'none';
        document.getElementById('tabTerminals').style.display = tab === 'terminals' ? 'block' : 'none';
        if (tab === 'instances') loadInstances();
        else loadTerminals();
      });
    });

    // ============================================================
    // 看板实例管理
    // ============================================================

    /**
     * 加载所有看板实例
     */
    async function loadInstances() {
      try {
        instancesData = await getBoardInstances();
        renderInstances(instancesData);
      } catch(e) { console.error('加载实例失败:', e); }
    }

    /**
     * 渲染看板实例卡片列表
     * @param {Array} instances - 实例数组
     */
    function renderInstances(instances) {
      var grid = document.getElementById('instanceGrid');
      var empty = document.getElementById('instanceEmpty');
      var count = document.getElementById('instanceCount');
      if (!instances || instances.length === 0) {
        grid.style.display = 'none'; empty.style.display = 'block';
        if (count) count.textContent = '0'; return;
      }
      grid.style.display = 'grid'; empty.style.display = 'none';
      if (count) count.textContent = instances.length;

      var statusMap = { published:'已发布', draft:'草稿', offline:'已下架' };
      grid.innerHTML = instances.map(function(inst) {
        var statusClass = inst.status || 'draft';
        var statusLabel = statusMap[statusClass] || inst.status;
        var isPublished = statusClass === 'published';
        return '<div class="instance-card">' +
          '<div class="card-header">' +
            '<span class="card-title">' + inst.name + '</span>' +
            '<span class="status-badge ' + statusClass + '">' + statusLabel + '</span>' +
          '</div>' +
          '<div class="card-desc">' + (inst.description || '基于: ' + (inst.template_name||'模板#'+inst.template_id)) + '</div>' +
          '<div class="card-meta">' +
            '<span><i class="fas fa-th"></i> ' + (inst.layout_type||'--') + '</span>' +
            '<span><i class="fas fa-sync-alt"></i> 每' + (parseInt(localStorage.getItem('dashboard_refreshInterval'))/1000 || inst.refresh_interval||30) + '秒</span>' +
          '</div>' +
          '<div class="card-actions">' +
            '<button class="view-instance-btn" data-id="' + inst.id + '" style="background:var(--color-primary);border:none;color:#fff;">' +
              '<i class="fas fa-eye"></i> ' + (isPublished ? '查看' : '预览') +
            '</button>' +
            '<button class="publish-instance-btn" data-id="' + inst.id + '" data-status="' + statusClass + '" style="background:' + (isPublished?'#ffd740':'#00e676') + ';border:none;color:#000;">' +
              (isPublished ? '下架' : '发布') +
            '</button>' +
            '<button class="assign-instance-btn" data-id="' + inst.id + '" style="border:1px solid var(--color-primary);background:transparent;color:var(--color-primary);" title="分配看板给员工">' +
              '<i class="fas fa-user-plus"></i> 分配' +
            '</button>' +
            '<button class="del-instance-btn" data-id="' + inst.id + '" data-name="' + inst.name.replace(/'/g,"\\'") + '" style="border:1px solid var(--color-danger);background:transparent;color:var(--color-danger);">' +
              '<i class="fas fa-trash"></i>' +
            '</button>' +
          '</div>' +
        '</div>';
      }).join('');

      // 查看/预览按钮：在新标签页打开展示页面
      grid.querySelectorAll('.view-instance-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          window.open('../display.html?instance_id=' + this.dataset.id, '_blank');
        });
      });
      // 发布/下架按钮：切换实例状态
      grid.querySelectorAll('.publish-instance-btn').forEach(function(btn) {
        btn.addEventListener('click', async function() {
          var id = parseInt(this.dataset.id);
          var status = this.dataset.status;
          var newStatus = status === 'published' ? 'draft' : 'published';
          var label = newStatus === 'published' ? '发布' : '下架';
          if (!confirm('确定要' + label + '该看板吗？')) return;
          try {
            await publishBoardInstance(id, newStatus);
            showToast('✅ 看板已' + label);
            loadInstances();
          } catch(e) { alert('操作失败: ' + e.message); }
        });
      });
      // 分配按钮：打开分配用户弹窗
      grid.querySelectorAll('.assign-instance-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          openAssignModal(parseInt(this.dataset.id));
        });
      });
      // 删除按钮：确认后删除实例
      grid.querySelectorAll('.del-instance-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var id = parseInt(this.dataset.id);
          var name = this.dataset.name;
          if (confirm('确定要删除实例 "' + name + '" 吗？')) {
            deleteBoardInstance(id).then(function() {
              showToast('✅ 实例已删除'); loadInstances();
            }).catch(function(e) { alert('删除失败: ' + e.message); });
          }
        });
      });
    }

    // ============================================================
    // 展示终端管理（员工在线状态）
    // ============================================================

    /**
     * 加载所有展示终端的在线状态
     */
    async function loadTerminals() {
      try {
        terminalsData = await request('/terminals/status');
        renderTerminals(terminalsData);
      } catch(e) { console.error('加载终端状态失败:', e); }
    }

    /**
     * 渲染展示终端卡片列表
     * @param {Array} terminals - 终端数据数组
     * 每张卡片显示：用户名、在线/离线状态、设备类型、最后活跃时间、绑定的看板实例
     */
    function renderTerminals(terminals) {
      var grid = document.getElementById('terminalGrid');
      var empty = document.getElementById('terminalEmpty');
      var count = document.getElementById('terminalCount');
      if (!terminals || terminals.length === 0) {
        grid.style.display = 'none'; empty.style.display = 'block';
        if (count) count.textContent = '0'; return;
      }
      grid.style.display = 'grid'; empty.style.display = 'none';
      if (count) count.textContent = terminals.length;

      var typeMap = { pc:'💻 PC', tablet:'📱 平板', mobile:'📱 手机' };
      grid.innerHTML = terminals.map(function(t) {
        var online = t.online;
        var deviceLabel = typeMap[t.device_type] || (t.device_type ? '💻 ' + t.device_type : '--');
        var lastActive = t.last_active ? t.last_active.replace('T',' ').substring(0,19) : null;
        var timeLabel = online ? lastActive : (lastActive ? '最后在线 ' + lastActive : '从未在线');
        return '<div class="terminal-card">' +
          '<div class="tc-header">' +
            '<span class="tc-name">' + (t.user_name || t.username) + '</span>' +
            '<span style="font-size:12px;color:' + (online?'#00e676':'#546e7a') + ';">' + (online?'● 在线':'○ 离线') + '</span>' +
          '</div>' +
          '<div style="font-size:12px;color:var(--text-secondary);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">' +
            '<span><i class="fas fa-' + (t.device_type==='mobile'?'mobile-alt':t.device_type==='tablet'?'tablet-alt':'laptop') + '"></i> ' + deviceLabel + '</span>' +
            '<span><i class="fas fa-clock"></i> ' + timeLabel + '</span>' +
          '</div>' +
          '<div style="font-size:12px;color:var(--text-secondary);">' +
            '<i class="fas fa-clipboard"></i> ' + (t.instance_name || '未分配看板') +
          '</div>' +
        '</div>';
      }).join('');
    }

    // ============================================================
    // 新建看板实例：打开弹窗 → 选择模板 → 填写名称 → 提交创建
    // ============================================================
    document.getElementById('createInstanceBtn').addEventListener('click', async function() {
      try {
        // 加载模板列表供选择
        var templates = await getBoardTemplates();
        var sel = document.getElementById('inst_template');
        sel.innerHTML = '<option value="">请选择模板</option>';
        templates.forEach(function(t) {
          sel.innerHTML += '<option value="' + t.id + '">' + t.name + '</option>';
        });
        document.getElementById('inst_name').value = '';
        document.getElementById('inst_interval').value = '30';
        document.getElementById('instanceModal').style.display = 'flex';
      } catch(e) { alert('加载模板列表失败: ' + e.message); }
    });

    // 取消按钮：关闭弹窗
    document.getElementById('inst_cancel').addEventListener('click', function() {
      document.getElementById('instanceModal').style.display = 'none';
    });
    // 点击遮罩层关闭弹窗
    document.getElementById('instanceModal').addEventListener('click', function(e) {
      if (e.target === this) this.style.display = 'none';
    });

    // 确认创建：校验模板和名称后调用 API
    document.getElementById('inst_save').addEventListener('click', async function() {
      var templateId = parseInt(document.getElementById('inst_template').value);
      var name = document.getElementById('inst_name').value.trim();
      var interval = parseInt(document.getElementById('inst_interval').value) || 30;
      if (!templateId) { alert('请选择模板'); return; }
      if (!name) { alert('请输入实例名称'); return; }
      try {
        await createBoardInstance({ template_id: templateId, name: name, refresh_interval: interval });
        showToast('✅ 实例已创建');
        document.getElementById('instanceModal').style.display = 'none';
        loadInstances();
      } catch(e) { alert('创建失败: ' + e.message); }
    });

    // ============================================================
    // 分配看板给员工：弹窗 → 加载用户列表 → 勾选 → 保存分配
    // ============================================================
    var assignInstanceId = null;

    /**
     * 打开分配看板弹窗
     * @param {number} instanceId - 看板实例 ID
     * 加载所有普通员工（viewer 角色），已分配的用户默认勾选
     */
    async function openAssignModal(instanceId) {
      assignInstanceId = instanceId;
      document.getElementById('assignDesc').textContent = '选择可以查看此看板的员工：';
      document.getElementById('assignUserList').innerHTML = '<div style="color:var(--text-secondary);text-align:center;padding:24px;font-size:14px;"><i class="fas fa-spinner fa-spin" style="margin-right:6px;"></i>加载中...</div>';
      document.getElementById('assignModal').style.display = 'flex';
      try {
        var users = await getUsers();
        var assignments = await request('/board-instances/' + instanceId + '/assignments');
        var assignedIds = assignments.map(function(a) { return a.id; });
        // 只显示普通员工(viewer)，过滤掉管理员/主管
        var viewers = users.filter(function(u) {
          var roles = Array.isArray(u.roles) ? u.roles : (u.roles || '').split(',').filter(Boolean);
          return roles.length === 1 && roles[0] === 'viewer';
        });
        var container = document.getElementById('assignUserList');
        if (viewers.length === 0) {
          container.innerHTML = '<div style="text-align:center;padding:32px;color:var(--text-secondary);font-size:14px;">暂无普通员工账号，请先在系统设置中注册</div>';
          return;
        }
        // 渲染勾选列表：每项为一个 checkbox + 用户名 + 角色标签
        container.innerHTML = viewers.map(function(u) {
          var checked = assignedIds.indexOf(u.id) !== -1 ? 'checked' : '';
          return '<label style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border-color);border-radius:8px;cursor:pointer;transition:all 0.2s;">' +
            '<input type="checkbox" class="assign-user-cb" value="' + u.id + '" ' + checked + ' style="width:16px;height:16px;accent-color:var(--color-primary,#6C3FF5);cursor:pointer;">' +
            '<div><div style="font-size:14px;color:var(--text-primary);">' + (u.name || u.username) + '</div>' +
            '<div style="font-size:12px;color:var(--text-secondary);">' + u.username + ' · 普通员工</div></div>' +
          '</label>';
        }).join('');
        container.querySelectorAll('label').forEach(function(label) {
          label.addEventListener('mouseenter', function() { this.style.borderColor = 'var(--color-primary)'; });
          label.addEventListener('mouseleave', function() { this.style.borderColor = ''; });
        });
      } catch(e) {
        document.getElementById('assignUserList').innerHTML = '<div style="text-align:center;padding:24px;color:var(--color-danger);font-size:14px;">加载失败: ' + e.message + '</div>';
      }
    }

    // 取消分配：关闭弹窗
    document.getElementById('assignCancel').addEventListener('click', function() {
      document.getElementById('assignModal').style.display = 'none';
    });
    // 点击遮罩层关闭分配弹窗
    document.getElementById('assignModal').addEventListener('click', function(e) {
      if (e.target === this) this.style.display = 'none';
    });
    // 保存分配：收集勾选的用户 ID 列表，提交到后端
    document.getElementById('assignSave').addEventListener('click', async function() {
      var checkboxes = document.querySelectorAll('.assign-user-cb:checked');
      var userIds = Array.from(checkboxes).map(function(cb) { return parseInt(cb.value); });
      if (!assignInstanceId) return;
      try {
        await request('/board-instances/' + assignInstanceId + '/assign', {
          method: 'POST',
          body: JSON.stringify({ user_ids: userIds })
        });
        showToast('✅ 分配已保存');
        document.getElementById('assignModal').style.display = 'none';
      } catch(e) {
        alert('分配失败: ' + e.message);
      }
    });

    // ============================================================
    // 刷新按钮：根据当前激活的 Tab 刷新对应数据
    // ============================================================
    document.getElementById('refreshBtn').addEventListener('click', function() {
      var activeTab = document.querySelector('.tab-btn.active');
      if (activeTab && activeTab.dataset.tab === 'terminals') loadTerminals();
      else loadInstances();
    });

    // ============================================================
    // Toast 消息提示：底部居中显示，2 秒后自动淡出消失
    // ============================================================
    function showToast(msg) {
      var t = document.createElement('div');
      t.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:99999;background:#1a2335;color:#e8edf5;padding:12px 24px;border-radius:8px;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,0.3);border:1px solid #2a3a5c;white-space:nowrap;';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(function() { t.style.opacity='0'; t.style.transition='opacity 0.3s'; setTimeout(function() { t.remove(); }, 300); }, 2000);
    }

    // ============================================================
    // 页面初始化：加载看板实例列表，300ms 后隐藏加载进度条
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      loadInstances();
      setTimeout(function() {
        document.getElementById('pageLoader')?.classList.add('hide');
      }, 300);
    });
  </script>
</body>
</html>

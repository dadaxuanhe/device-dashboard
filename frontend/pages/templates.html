<!DOCTYPE html>
<!-- ============================================================
     页面：看板模板管理页 (templates.html)
     用途：管理看板模板，支持创建/编辑/删除模板，查看模板详情
           （含关联组件列表），布局类型支持单栏/双栏/三栏/混合。
     所属项目：智能工厂设备监控看板
     ============================================================ -->
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>看板模板 - 设备监控看板</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    /* ===== 看板模板页专属样式 ===== */
    .page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
    .page-title { font-size:24px; font-weight:600; color:var(--text-primary); }
    .template-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px; }  /* 模板卡片网格 */
    .template-card {
      background:var(--bg-card); border:1px solid var(--border-color); border-radius:12px;
      padding:20px; cursor:pointer; transition:all 0.2s;
    }
    .template-card:hover { transform:translateY(-2px); border-color:var(--color-primary); box-shadow:0 4px 16px rgba(0,0,0,0.15); }  /* 悬停上浮 */
    .template-card .card-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
    .template-card .card-title { font-size:16px; font-weight:600; color:var(--text-primary); }
    .template-card .card-desc { font-size:13px; color:var(--text-secondary); margin-bottom:12px; line-height:1.5; }  /* 模板描述 */
    .template-card .card-meta { display:flex; gap:12px; font-size:12px; color:var(--text-secondary); }
    .template-card .card-meta span { display:flex; align-items:center; gap:4px; }
    .template-card .card-actions { display:flex; gap:6px; margin-top:12px; padding-top:12px; border-top:1px solid var(--border-light); }  /* 操作按钮区 */
    .layout-badge {  /* 布局类型徽章 */
      display:inline-block; padding:2px 10px; border-radius:10px; font-size:11px;
    }
    .layout-badge.single { background:rgba(0,230,118,0.15); color:#00e676; }  /* 单栏 → 绿色 */
    .layout-badge.double { background:rgba(61,90,254,0.15); color:#3d5afe; }  /* 双栏 → 蓝色 */
    .layout-badge.triple { background:rgba(255,145,0,0.15); color:#ff9100; }  /* 三栏 → 橙色 */
    .layout-badge.mixed { background:rgba(156,39,176,0.15); color:#9c27b0; }  /* 混合 → 紫色 */

    /* 模板编辑器模态框 */
    .editor-container {
      display:grid; grid-template-columns:240px 1fr; gap:16px; height:calc(100vh - 200px); min-height:500px;
    }
    .editor-sidebar {  /* 左侧组件库面板 */
      background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:8px; padding:12px; overflow-y:auto;
    }
    .editor-sidebar h4 { font-size:13px; color:var(--text-secondary); margin:0 0 8px 0; }
    .editor-canvas {  /* 右侧画布区域 */
      background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:8px;
      padding:16px; overflow-y:auto; position:relative;
    }
    .canvas-placeholder {  /* 画布为空时的占位提示 */
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      height:100%; min-height:300px; color:var(--text-secondary); font-size:14px;
    }
    .canvas-layout {  /* 画布网格布局容器 */
      display:grid; gap:12px; min-height:200px;
    }
    .canvas-layout.single { grid-template-columns:1fr; }    /* 单栏 */
    .canvas-layout.double { grid-template-columns:1fr 1fr; } /* 双栏 */
    .canvas-layout.triple { grid-template-columns:1fr 1fr 1fr; }  /* 三栏 */
    .canvas-layout.mixed { grid-template-columns:2fr 1fr; }      /* 混合(左宽右窄) */

    .comp-item {  /* 组件库中的可拖动组件项 */
      padding:8px 10px; margin-bottom:6px; background:var(--bg-card); border:1px solid var(--border-color);
      border-radius:6px; cursor:grab; font-size:13px; color:var(--text-primary);
      display:flex; align-items:center; gap:8px; transition:all 0.2s;
    }
    .comp-item:hover { border-color:var(--color-primary); background:rgba(108,63,245,0.08); }
    .comp-item i { width:18px; text-align:center; color:var(--color-primary); }

    .canvas-cell {  /* 画布上的组件格子 */
      background:var(--bg-card); border:1px dashed var(--border-color); border-radius:8px;
      padding:12px; min-height:120px; display:flex; flex-direction:column;
    }
    .canvas-cell.has-component { border-style:solid; border-color:var(--color-primary); }  /* 已有组件时实线边框 */
    .canvas-cell .cell-header { display:flex; justify-content:space-between; font-size:12px; color:var(--text-secondary); margin-bottom:8px; }
    .canvas-cell .cell-content { flex:1; display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--text-secondary); }
    .canvas-cell .cell-remove { cursor:pointer; color:var(--color-danger); font-size:11px; }  /* 移除组件按钮 */

    .empty-state { text-align:center; padding:60px 20px; color:var(--text-secondary); }  /* 空状态提示 */
    .empty-state i { font-size:48px; margin-bottom:16px; opacity:0.3; }
    .empty-state p { font-size:14px; line-height:1.8; }
  </style>
</head>
<body>
  <div id="pageLoader" style="position:fixed;inset:0;z-index:99999;background:#0a0e17;display:flex;align-items:center;justify-content:center;transition:opacity 0.5s;">
    <div style="width:200px;text-align:center;"><div style="width:36px;height:36px;border:3px solid rgba(108,63,245,0.3);border-top-color:#6C3FF5;border-radius:50%;animation:loaderSpin 0.8s linear infinite;margin:0 auto 12px;"></div><div style="color:#6a7588;font-size:13px;">加载中...</div></div>
  </div>
  <style>@keyframes loaderSpin{to{transform:rotate(360deg)}}#pageLoader.hide{opacity:0;pointer-events:none}</style>

  <div id="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand"><i class="fas fa-cubes"></i> 智能看板</div>
      <nav class="sidebar-nav">
        <a href="../index.html" class="nav-item" data-page="dashboard">
          <img src="../assets/icons/dashboard.svg" class="nav-icon">
          <span class="nav-text">总览看板</span>
        </a>
        <a href="detail.html" class="nav-item" data-page="detail">
          <img src="../assets/icons/device.svg" class="nav-icon">
          <span class="nav-text">设备管理</span>
        </a>
        <a href="alarms.html" class="nav-item" data-page="alarms">
          <img src="../assets/icons/alarm.svg" class="nav-icon">
          <span class="nav-text">告警管理</span>
          <span class="nav-badge" id="alarmBadge" style="display:none;">0</span>
        </a>
        <a href="personnel.html" class="nav-item" data-page="personnel">
          <img src="../assets/icons/user.svg" class="nav-icon">
          <span class="nav-text">人员管理</span>
        </a>
        <a href="templates.html" class="nav-item active" data-page="templates">
          <img src="../assets/icons/template.svg" class="nav-icon">
          <span class="nav-text">看板模板</span>
        </a>
        <a href="publish.html" class="nav-item" data-page="publish">
          <img src="../assets/icons/publish.svg" class="nav-icon">
          <span class="nav-text">发布管理</span>
        </a>
        <a href="settings.html" class="nav-item" data-page="settings">
          <img src="../assets/icons/settings.svg" class="nav-icon">
          <span class="nav-text">系统设置</span>
        </a>
      </nav>
      <div class="sidebar-footer"><div class="clock" id="headerClock">--:--:--</div></div>
    </aside>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <main id="mainContent" class="main-content">
      <!-- 页面头部 -->
      <div class="top-bar">
        <button id="sidebarToggle" class="top-bar__btn"><i class="fas fa-bars"></i></button>
        <div class="top-bar__title">看板模板管理</div>
        <div class="top-bar__actions">
          <button id="refreshBtn" class="top-bar__btn" title="刷新"><i class="fas fa-sync-alt"></i></button>
          <button id="topThemeBtn" class="top-bar__btn" title="切换主题"><i class="fas fa-moon"></i></button>
        </div>
      </div>

      <div class="page-content">
        <div class="page-header">
          <div class="page-title">看板模板 <span class="badge" id="templateCount"></span></div>
          <div>
            <button id="createTemplateBtn" class="btn-save"><i class="fas fa-plus"></i> 新建模板</button>
          </div>
        </div>

        <!-- 模板列表 -->
        <div id="templateList">
          <div class="empty-state" id="templateEmpty">
            <i class="fas fa-layer-group"></i>
            <p>暂无看板模板<br>点击右上角「新建模板」开始创建</p>
          </div>
          <div class="template-grid" id="templateGrid" style="display:none;"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- 新建/编辑模板模态框 -->
  <div id="templateModal" style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;">
    <div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:24px;width:520px;max-width:90vw;">
      <h3 style="color:var(--text-primary);margin:0 0 16px 0;" id="templateModalTitle">新建看板模板</h3>
      <div style="display:grid;gap:12px;">
        <div>
          <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:4px;">模板名称 *</label>
          <input id="tpl_name" style="width:100%;padding:10px 14px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);font-size:14px;box-sizing:border-box;" placeholder="如：生产总览看板">
        </div>
        <div>
          <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:4px;">描述</label>
          <textarea id="tpl_desc" rows="2" style="width:100%;padding:10px 14px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);font-size:14px;box-sizing:border-box;resize:vertical;" placeholder="模板用途说明"></textarea>
        </div>
        <div>
          <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:4px;">布局类型</label>
          <div style="display:flex;gap:8px;flex-wrap:wrap;" id="layoutSelector">
            <label class="layout-option" style="flex:1;padding:12px;border:2px solid var(--border-color);border-radius:8px;cursor:pointer;text-align:center;transition:all 0.2s;" data-value="single">
              <div style="display:flex;gap:3px;justify-content:center;margin-bottom:6px;"><div style="width:100%;height:6px;background:var(--color-primary);border-radius:2px;"></div></div>
              <span style="font-size:12px;color:var(--text-secondary);">单栏</span>
            </label>
            <label class="layout-option" style="flex:1;padding:12px;border:2px solid var(--border-color);border-radius:8px;cursor:pointer;text-align:center;transition:all 0.2s;" data-value="double">
              <div style="display:flex;gap:3px;justify-content:center;margin-bottom:6px;"><div style="width:48%;height:6px;background:var(--color-primary);border-radius:2px;"></div><div style="width:48%;height:6px;background:var(--color-primary);border-radius:2px;"></div></div>
              <span style="font-size:12px;color:var(--text-secondary);">双栏</span>
            </label>
            <label class="layout-option" style="flex:1;padding:12px;border:2px solid var(--border-color);border-radius:8px;cursor:pointer;text-align:center;transition:all 0.2s;" data-value="triple">
              <div style="display:flex;gap:3px;justify-content:center;margin-bottom:6px;"><div style="width:31%;height:6px;background:var(--color-primary);border-radius:2px;"></div><div style="width:31%;height:6px;background:var(--color-primary);border-radius:2px;"></div><div style="width:31%;height:6px;background:var(--color-primary);border-radius:2px;"></div></div>
              <span style="font-size:12px;color:var(--text-secondary);">三栏</span>
            </label>
            <label class="layout-option" style="flex:1;padding:12px;border:2px solid var(--border-color);border-radius:8px;cursor:pointer;text-align:center;transition:all 0.2s;" data-value="mixed">
              <div style="display:flex;gap:3px;justify-content:center;margin-bottom:6px;"><div style="width:64%;height:6px;background:var(--color-primary);border-radius:2px;"></div><div style="width:32%;height:6px;background:var(--color-primary);border-radius:2px;"></div></div>
              <span style="font-size:12px;color:var(--text-secondary);">混合</span>
            </label>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
        <button id="tpl_cancel" style="padding:10px 20px;border:1px solid var(--border-color);background:transparent;border-radius:8px;color:var(--text-secondary);cursor:pointer;font-size:14px;">取消</button>
        <button id="tpl_save" style="padding:10px 20px;border:none;background:var(--color-primary,#6C3FF5);border-radius:8px;color:#fff;cursor:pointer;font-size:14px;">创建模板</button>
      </div>
    </div>
  </div>

  <!-- 模板编辑器模态框 -->
  <div id="editorModal" style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.7);padding:20px;">
    <div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;height:100%;display:flex;flex-direction:column;overflow:hidden;">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border-color);flex-shrink:0;">
        <div><strong style="color:var(--text-primary);font-size:16px;" id="editorTitle">编辑模板</strong></div>
        <div style="display:flex;gap:8px;">
          <button id="editorPreviewBtn" style="padding:6px 14px;border:1px solid var(--border-color);background:transparent;border-radius:6px;color:var(--text-secondary);cursor:pointer;font-size:13px;"><i class="fas fa-eye"></i> 预览</button>
          <button id="editorCloseBtn" style="padding:6px 14px;border:1px solid var(--color-danger);background:transparent;border-radius:6px;color:var(--color-danger);cursor:pointer;font-size:13px;">关闭</button>
        </div>
      </div>
      <div style="flex:1;overflow:hidden;padding:16px;">
        <div class="editor-container">
          <div class="editor-sidebar" id="compLibrary">
            <h4><i class="fas fa-cube"></i> 组件库</h4>
            <div id="compList"><div style="color:var(--text-secondary);font-size:13px;padding:8px;">加载中...</div></div>
            <h4 style="margin-top:16px;"><i class="fas fa-palette"></i> 操作提示</h4>
            <div style="font-size:12px;color:var(--text-secondary);line-height:1.8;padding:4px;">
              • 点击组件将其添加到画布<br>
              • 在画布上点击组件可配置<br>
              • 点击 × 可移除组件
            </div>
          </div>
          <div class="editor-canvas" id="editorCanvas">
            <div class="canvas-placeholder" id="canvasPlaceholder">
              <i class="fas fa-arrow-left" style="font-size:32px;margin-bottom:12px;opacity:0.3;"></i>
              <p style="color:var(--text-secondary);">从左侧组件库点击添加组件到看板</p>
            </div>
            <div class="canvas-layout" id="canvasLayout" style="display:none;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 组件配置模态框 -->
  <div id="compConfigModal" style="display:none;position:fixed;inset:0;z-index:10001;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;">
    <div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:24px;width:440px;max-width:90vw;">
      <h3 style="color:var(--text-primary);margin:0 0 16px 0;" id="compConfigTitle">配置组件</h3>
      <div style="display:grid;gap:12px;">
        <div>
          <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:4px;">显示标题</label>
          <input id="cc_title" style="width:100%;padding:10px 14px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);font-size:14px;box-sizing:border-box;">
        </div>
        <div>
          <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:4px;">刷新间隔（秒）</label>
          <input id="cc_interval" type="number" min="0" value="10" style="width:100%;padding:10px 14px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);font-size:14px;box-sizing:border-box;">
        </div>
        <div>
          <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:4px;">宽度比例</label>
          <select id="cc_width" style="width:100%;padding:10px 14px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);font-size:14px;">
            <option value="1">1 列</option>
            <option value="2">2 列</option>
            <option value="3">3 列</option>
          </select>
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
        <button id="cc_cancel" style="padding:10px 20px;border:1px solid var(--border-color);background:transparent;border-radius:8px;color:var(--text-secondary);cursor:pointer;font-size:14px;">取消</button>
        <button id="cc_save" style="padding:10px 20px;border:none;background:var(--color-primary,#6C3FF5);border-radius:8px;color:#fff;cursor:pointer;font-size:14px;">确认</button>
      </div>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script>
    // ============================================================
    // 变量声明
    // ============================================================
    var currentTemplates = [];           // 当前模板列表缓存
    var editingTemplateId = null;        // 正在编辑的模板 ID
    var editingComponents = [];          // 正在编辑的模板的组件列表
    var selectedCompIndex = -1;          // 当前配置的组件索引
    var compLibraryMap = {};             // 组件库映射 { id: component }

    // ============================================================
    // 加载模板列表
    // ============================================================

    /**
     * 从后端获取所有看板模板
     */
    async function loadTemplates() {
      try {
        currentTemplates = await getBoardTemplates();
        renderTemplates(currentTemplates);
      } catch(e) { console.error('加载模板失败:', e); }
    }

    /**
     * 渲染模板卡片网格
     * @param {Array} templates - 模板数组
     * 每张卡片显示：名称、描述、布局类型、组件数、编辑/删除按钮
     */
    function renderTemplates(templates) {
      var grid = document.getElementById('templateGrid');
      var empty = document.getElementById('templateEmpty');
      var count = document.getElementById('templateCount');
      if (!templates || templates.length === 0) {
        grid.style.display = 'none';
        empty.style.display = 'block';
        if (count) count.textContent = '0';
        return;
      }
      grid.style.display = 'grid';
      empty.style.display = 'none';
      if (count) count.textContent = templates.length;

      var layoutLabels = { single:'单栏', double:'双栏', triple:'三栏', mixed:'混合' };
      grid.innerHTML = templates.map(function(t) {
        var layout = layoutLabels[t.layout_type] || t.layout_type;
        var badgeClass = t.layout_type;
        return '<div class="template-card" data-id="' + t.id + '">' +
          '<div class="card-header"><span class="card-title">' + t.name + '</span></div>' +
          '<div class="card-desc">' + (t.description || '暂无描述') + '</div>' +
          '<div class="card-meta">' +
            '<span><i class="fas fa-th"></i> <span class="layout-badge ' + badgeClass + '">' + layout + '</span></span>' +
            '<span><i class="fas fa-puzzle-piece"></i> ' + (t.component_count||0) + ' 组件</span>' +
          '</div>' +
          '<div class="card-actions">' +
            '<button class="edit-template-btn" data-id="' + t.id + '" style="flex:1;padding:6px;border:1px solid var(--color-primary);background:transparent;border-radius:6px;color:var(--color-primary);cursor:pointer;font-size:12px;"><i class="fas fa-edit"></i> 编辑</button>' +
            '<button class="del-template-btn" data-id="' + t.id + '" data-name="' + t.name.replace(/'/g,"\\'") + '" style="padding:6px 10px;border:1px solid var(--color-danger);background:transparent;border-radius:6px;color:var(--color-danger);cursor:pointer;font-size:12px;"><i class="fas fa-trash"></i></button>' +
          '</div>' +
        '</div>';
      }).join('');

      // 编辑按钮：打开模板编辑器
      grid.querySelectorAll('.edit-template-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) { e.stopPropagation(); openEditor(parseInt(this.dataset.id)); });
      });
      // 删除按钮：确认后删除
      grid.querySelectorAll('.del-template-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          var id = parseInt(this.dataset.id);
          var name = this.dataset.name;
          if (confirm('确定要删除模板 "' + name + '" 吗？')) {
            deleteBoardTemplate(id).then(function() {
              showToast('✅ 模板已删除');
              loadTemplates();
            }).catch(function(e) { alert('删除失败: ' + e.message); });
          }
        });
      });
      // 点击整张卡片也进入编辑
      grid.querySelectorAll('.template-card').forEach(function(card) {
        card.addEventListener('click', function() { openEditor(parseInt(this.dataset.id)); });
      });
    }

    // ============================================================
    // 新建/编辑模板模态框
    // ============================================================
    var editingTemplateData = null;  // 编辑中的模板数据，null 表示新建

    /**
     * 打开新建/编辑模板弹窗
     * @param {Object|null} template - 要编辑的模板对象，null 表示新建
     */
    function openTemplateModal(template) {
      editingTemplateData = template || null;
      document.getElementById('templateModalTitle').textContent = template ? '编辑看板模板' : '新建看板模板';
      document.getElementById('tpl_save').textContent = template ? '保存修改' : '创建模板';
      document.getElementById('tpl_name').value = template ? template.name : '';
      document.getElementById('tpl_desc').value = template ? (template.description||'') : '';
      // 回显布局类型选中状态
      document.querySelectorAll('.layout-option').forEach(function(el) {
        el.style.borderColor = el.dataset.value === (template ? template.layout_type : 'single') ? 'var(--color-primary)' : 'var(--border-color)';
      });
      document.getElementById('templateModal').style.display = 'flex';
    }

    // 布局选择器：点击高亮
    document.querySelectorAll('.layout-option').forEach(function(el) {
      el.addEventListener('click', function() {
        document.querySelectorAll('.layout-option').forEach(function(e) { e.style.borderColor = 'var(--border-color)'; });
        this.style.borderColor = 'var(--color-primary)';
      });
    });

    // 取消按钮：关闭弹窗
    document.getElementById('tpl_cancel').addEventListener('click', function() {
      document.getElementById('templateModal').style.display = 'none';
    });
    // 点击遮罩关闭
    document.getElementById('templateModal').addEventListener('click', function(e) {
      if (e.target === this) this.style.display = 'none';
    });

    // 保存按钮：创建或更新模板
    document.getElementById('tpl_save').addEventListener('click', async function() {
      var name = document.getElementById('tpl_name').value.trim();
      if (!name) { alert('请输入模板名称'); return; }
      var desc = document.getElementById('tpl_desc').value.trim();
      var layout = document.querySelector('.layout-option[style*="var(--color-primary)"]')?.dataset?.value || 'single';

      try {
        if (editingTemplateData) {
          await updateBoardTemplate(editingTemplateData.id, { name:name, description:desc, layout_type:layout, status:editingTemplateData.status });
          showToast('✅ 模板已更新');
        } else {
          await createBoardTemplate({ name:name, description:desc, layout_type:layout });
          showToast('✅ 模板已创建');
        }
        document.getElementById('templateModal').style.display = 'none';
        loadTemplates();
      } catch(e) { alert('操作失败: ' + e.message); }
    });

    // ============================================================
    // 模板编辑器（包含：组件库、画布、组件添加/配置/移除）
    // ============================================================
    var compLibraryLoaded = false;  // 组件库是否已加载（只加载一次）

    /**
     * 打开模板编辑器
     * @param {number} templateId - 模板 ID
     * 加载模板详情和组件列表，渲染画布布局
     */
    async function openEditor(templateId) {
      editingTemplateId = templateId;
      editingComponents = [];
      selectedCompIndex = -1;
      document.getElementById('editorModal').style.display = 'block';

      try {
        var tpl = await getBoardTemplateDetail(templateId);
        document.getElementById('editorTitle').textContent = '编辑模板: ' + tpl.name;
        editingComponents = tpl.components || [];
        renderCanvasLayout(tpl.layout_type);

        if (!compLibraryLoaded) {
          await loadCompLibrary();  // 首次打开时加载组件库
          compLibraryLoaded = true;
        }
      } catch(e) { alert('加载模板失败: ' + e.message); }
    }

    /**
     * 加载组件库（左侧面板）
     * 所有可用组件列表，点击可添加到画布
     */
    async function loadCompLibrary() {
      try {
        var comps = await getComponentLibrary();
        var list = document.getElementById('compList');
        compLibraryMap = {};
        comps.forEach(function(c) { compLibraryMap[c.id] = c; });
        list.innerHTML = comps.map(function(c) {
          return '<div class="comp-item add-comp-btn" data-id="' + c.id + '" data-type="' + c.type + '">' +
            '<i class="' + (c.icon || 'fas fa-cube') + '"></i> ' + c.name +
            '</div>';
        }).join('');
        // 绑定点击添加事件
        list.querySelectorAll('.add-comp-btn').forEach(function(btn) {
          btn.addEventListener('click', function() { addComponentToCanvas(parseInt(this.dataset.id)); });
        });
      } catch(e) { console.error('加载组件库失败:', e); }
    }

    /**
     * 渲染画布布局网格
     * @param {string} layoutType - 布局类型 (single/double/triple/mixed)
     */
    function renderCanvasLayout(layoutType) {
      var canvas = document.getElementById('canvasLayout');
      var placeholder = document.getElementById('canvasPlaceholder');
      canvas.style.display = 'grid';
      placeholder.style.display = 'none';
      canvas.className = 'canvas-layout ' + (layoutType || 'single');
      renderCanvasComponents();
    }

    /**
     * 渲染画布上的所有组件
     * 每个组件显示为一个带标题和移除按钮的格子
     */
    function renderCanvasComponents() {
      var canvas = document.getElementById('canvasLayout');
      if (!canvas) return;
      if (!editingComponents || editingComponents.length === 0) {
        canvas.innerHTML = '<div class="canvas-cell" style="grid-column:1/-1;align-items:center;justify-content:center;color:var(--text-secondary);font-size:13px;">从左侧组件库点击添加组件</div>';
        return;
      }
      canvas.innerHTML = editingComponents.map(function(c, idx) {
        var name = c.comp_name || compLibraryMap[c.component_id]?.name || '组件#' + c.component_id;
        var icon = c.icon || compLibraryMap[c.component_id]?.icon || 'fas fa-cube';
        var pos = c.position || {};
        var colSpan = pos.width > 1 ? ' style="grid-column:span ' + pos.width + ';"' : '';  /* 跨列宽度 */
        return '<div class="canvas-cell has-component comp-config-btn" data-index="' + idx + '"' + colSpan + '>' +
          '<div class="cell-header">' +
            '<span><i class="' + icon + '"></i> ' + name + '</span>' +
            '<span class="cell-remove remove-comp-btn" data-index="' + idx + '"><i class="fas fa-times"></i> 移除</span>' +
          '</div>' +
          '<div class="cell-content"><i class="fas ' + icon + '" style="font-size:24px;opacity:0.3;margin-right:8px;"></i> ' + name + '</div>' +
        '</div>';
      }).join('');
      // 点击组件格子 → 打开配置面板
      canvas.querySelectorAll('.comp-config-btn').forEach(function(el) {
        el.addEventListener('click', function() {
          var idx = parseInt(this.dataset.index);
          openCompConfig(idx);
        });
      });
      // 点击移除按钮 → 从画布和数据库中移除
      canvas.querySelectorAll('.remove-comp-btn').forEach(function(el) {
        el.addEventListener('click', function(e) {
          e.stopPropagation();
          var idx = parseInt(this.dataset.index);
          var comp = editingComponents[idx];
          if (comp && comp.id) {
            removeTemplateComponent(editingTemplateId, comp.id).catch(function(err) {
              console.error('移除组件失败:', err);
            });
          }
          editingComponents.splice(idx, 1);  // 从本地列表中移除
          renderCanvasComponents();
        });
      });
    }

    /**
     * 从组件库添加组件到画布
     * @param {number} compId - 组件库中的组件 ID
     * 调用 API 添加后更新本地列表并重新渲染画布
     */
    async function addComponentToCanvas(compId) {
      var comp = compLibraryMap[compId];
      if (!comp) return;
      try {
        var result = await addTemplateComponent(editingTemplateId, {
          component_id: compId,
          position: { row:0, col:0, width:1, height:1 },
          config: { title: comp.name }
        });
        editingComponents.push({
          id: result.id,
          component_id: compId,
          comp_name: comp.name,
          icon: comp.icon,
          type: comp.type,
          position: { row:0, col:0, width:1, height:1 },
          config: { title: comp.name },
          refresh_interval: 0
        });
        renderCanvasComponents();
        showToast('✅ 已添加组件: ' + comp.name);
      } catch(e) { alert('添加组件失败: ' + e.message); }
    }

    function openCompConfig(index) {
      selectedCompIndex = index;
      var comp = editingComponents[index];
      var config = comp.config || {};
      document.getElementById('compConfigTitle').textContent = '配置: ' + (comp.comp_name || '组件');
      document.getElementById('cc_title').value = config.title || '';
      document.getElementById('cc_interval').value = comp.refresh_interval || 10;
      document.getElementById('cc_width').value = (comp.position?.width) || 1;
      document.getElementById('compConfigModal').style.display = 'flex';
    }

    document.getElementById('cc_cancel').addEventListener('click', function() {
      document.getElementById('compConfigModal').style.display = 'none';
    });
    document.getElementById('compConfigModal').addEventListener('click', function(e) {
      if (e.target === this) this.style.display = 'none';
    });

    document.getElementById('cc_save').addEventListener('click', async function() {
      if (selectedCompIndex < 0) return;
      var comp = editingComponents[selectedCompIndex];
      var title = document.getElementById('cc_title').value.trim();
      var interval = parseInt(document.getElementById('cc_interval').value) || 0;
      var width = parseInt(document.getElementById('cc_width').value) || 1;

      try {
        await updateTemplateComponent(editingTemplateId, comp.id, {
          config: { title: title || comp.comp_name },
          refresh_interval: interval,
          position: { row:0, col:0, width:width, height:1 }
        });
        comp.config = { title: title || comp.comp_name };
        comp.refresh_interval = interval;
        comp.position = { row:0, col:0, width:width, height:1 };
        document.getElementById('compConfigModal').style.display = 'none';
        renderCanvasComponents();
        showToast('✅ 组件已更新');
      } catch(e) { alert('更新组件失败: ' + e.message); }
    });

    // 预览按钮：在新标签页打开模板的展示页
    document.getElementById('editorPreviewBtn').addEventListener('click', function() {
      if (editingTemplateId) {
        window.open('../display.html?template_id=' + editingTemplateId, '_blank');
      }
    });

    // 关闭编辑器：关闭弹窗并刷新模板列表
    document.getElementById('editorCloseBtn').addEventListener('click', function() {
      document.getElementById('editorModal').style.display = 'none';
      loadTemplates();
    });

    // 创建按钮：打开新建模板弹窗
    document.getElementById('createTemplateBtn').addEventListener('click', function() {
      openTemplateModal(null);
    });

    // 刷新按钮：重新加载模板列表
    document.getElementById('refreshBtn').addEventListener('click', function() {
      loadTemplates();
    });

    // ============================
    // Toast 消息提示：底部居中，2 秒后自动淡出消失
    // ============================
    function showToast(msg) {
      var t = document.createElement('div');
      t.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:99999;background:#1a2335;color:#e8edf5;padding:12px 24px;border-radius:8px;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,0.3);border:1px solid #2a3a5c;white-space:nowrap;';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(function() { t.style.opacity='0'; t.style.transition='opacity 0.3s'; setTimeout(function() { t.remove(); }, 300); }, 2000);
    }

    // ============================
    // 页面初始化：加载模板列表，300ms 后隐藏加载进度条
    // ============================
    document.addEventListener('DOMContentLoaded', function() {
      loadTemplates();
      setTimeout(function() {
        document.getElementById('pageLoader')?.classList.add('hide');
      }, 300);
    });
  </script>
</body>
</html>

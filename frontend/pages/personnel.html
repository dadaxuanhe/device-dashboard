<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人员管理 · 智能工厂</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    /* 仅 personnel 专属样式 */
    .staff-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
    .staff-card {
      background:var(--bg-card); border:1px solid var(--border-color);
      border-radius:var(--radius-md); padding:16px 18px;
      box-shadow:var(--shadow-card);
      transition:all 0.2s ease; cursor:default;
    }
    .staff-card:hover {
      transform:translateY(-2px);
      box-shadow:0 4px 16px rgba(0,0,0,0.15);
      border-color:var(--brand-purple,#6C3FF5);
    }
    .staff-card__name { font-size:16px; font-weight:600; }
    .staff-card__badge { display:inline-block; padding:2px 10px; border-radius:10px; font-size:12px; font-weight:500; margin:6px 0 8px; }
    .staff-card__badge.admin { background:rgba(108,63,245,0.15); color:#6C3FF5; }
    .staff-card__badge.engineer { background:rgba(0,188,212,0.15); color:#00bcd4; }
    .staff-card__badge.operator { background:rgba(0,230,118,0.15); color:#00e676; }
    .staff-card__info { font-size:13px; color:var(--text-secondary); line-height:1.8; }
    .staff-card__info i { width:18px; text-align:center; margin-right:4px; }
    .filter-bar2 { display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; font-size:13px; color:var(--text-secondary); }
    .filter-bar2 select { padding:6px 12px; background:var(--bg-card); border:1px solid var(--border-color); border-radius:6px; color:var(--text-primary); font-size:13px; outline:none; cursor:pointer; }
    .section-title { font-size:15px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
    .section-title i { color:var(--brand-purple,#6C3FF5); }
    @media (max-width:1023px){ .staff-grid{grid-template-columns:repeat(2,1fr)} }
    @media (max-width:767px){ .staff-grid{grid-template-columns:1fr} }
    #perfChart { width:100%; height:320px; }
  </style>
</head>
<body>
  <!-- ===== 加载进度条 ===== -->
  <div id="pageLoader" style="position:fixed;inset:0;z-index:99999;background:#0a0e17;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s ease;">
    <div style="width:280px;max-width:80%;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
        <div style="width:40px;height:40px;border:3px solid rgba(108,63,245,0.3);border-top-color:#6C3FF5;border-radius:50%;animation:loaderSpin 0.8s linear infinite;"></div>
        <div><div style="font-size:18px;font-weight:600;color:#e8edf5;">智能看板</div><div style="font-size:13px;color:#6a7588;margin-top:2px;">正在加载...</div></div>
      </div>
      <div style="height:4px;background:#1e293b;border-radius:4px;overflow:hidden;">
        <div id="loaderBar" style="height:100%;width:0%;background:linear-gradient(90deg,#6C3FF5,#8b5cf6);border-radius:4px;transition:width 0.4s ease;"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:#5a6478;margin-top:6px;">
        <span id="loaderStatus">初始化...</span>
        <span id="loaderPercent">0%</span>
      </div>
    </div>
  </div>
  <style>@keyframes loaderSpin{to{transform:rotate(360deg)}}#pageLoader.hide{opacity:0;pointer-events:none}</style>
  <script>
    (function(){var L=document.getElementById('pageLoader'),B=document.getElementById('loaderBar'),S=document.getElementById('loaderStatus'),P=document.getElementById('loaderPercent'),p=0;
    function setP(pct,msg){p=Math.min(pct,100);if(B)B.style.width=p+'%';if(P)P.textContent=p+'%';if(S&&msg)S.textContent=msg;}
    var steps={css:false,fonts:false,dom:false,api:false};
    function check(){if(steps.css&&steps.fonts&&steps.dom&&steps.api){setP(100,'加载完成');setTimeout(function(){L.classList.add('hide')},400);}}
    setP(5,'正在连接...');
    document.querySelectorAll('link[rel="stylesheet"]').forEach(function(l){if(l.sheet){steps.css=true;setP(25,'样式加载完成');check();return;}l.addEventListener('load',function(){steps.css=true;setP(25,'样式加载完成');check();});});
    if(document.readyState!=='loading'){steps.dom=true;setP(35,'页面结构就绪');check();}else document.addEventListener('DOMContentLoaded',function(){steps.dom=true;setP(35,'页面结构就绪');check();});
    if(document.fonts)document.fonts.ready.then(function(){steps.fonts=true;setP(45,'字体就绪');check();});else{steps.fonts=true;setP(45,'');check();}
    window.__loaderMarkApiReady=function(){steps.api=true;setP(80,'数据加载完成');check();};
    setTimeout(function(){if(L&&!L.classList.contains('hide')){setP(100,'加载完成');setTimeout(function(){L.classList.add('hide')},400);}},10000);})();
  </script>
  <!-- 侧边栏（与 index.html 完全一致） -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="../assets/icons/logo.svg" alt="Logo" class="sidebar-logo">
      <h1 class="sidebar-title">智能看板</h1>
      <button class="sidebar-toggle" id="sidebarToggle">
        <img src="../assets/icons/collapse.svg" alt="折叠">
      </button>
    </div>
    <nav class="sidebar-nav">
      <a href="../index.html" class="nav-item" data-page="dashboard">
        <img src="../assets/icons/dashboard.svg" class="nav-icon">
        <span class="nav-text">总览看板</span>
      </a>
      <a href="detail.html" class="nav-item" data-page="detail">
        <img src="../assets/icons/device.svg" class="nav-icon">
        <span class="nav-text">设备管理</span>
      </a>
      <a href="alarms.html" class="nav-item" data-page="alarms">
        <img src="../assets/icons/alarm.svg" class="nav-icon">
        <span class="nav-text">告警管理</span>
        <span class="nav-badge" id="alarmBadge" style="display:none;">0</span>
      </a>
      <a href="personnel.html" class="nav-item active" data-page="personnel">
        <img src="../assets/icons/user.svg" class="nav-icon">
        <span class="nav-text">人员管理</span>
      </a>
      <a href="settings.html" class="nav-item" data-page="settings">
        <img src="../assets/icons/settings.svg" class="nav-icon">
        <span class="nav-text">系统设置</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon" id="themeIcon"></i>
        <span class="theme-label">暗色主题</span>
      </button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- 主内容区（与 index.html 完全一致） -->
  <div class="main" id="mainContent">
    <header class="topbar">
      <div class="topbar__left">
        <span class="topbar__hamburger" id="menuBtn"><i class="fas fa-bars"></i></span>
        <span class="topbar__breadcrumb">首页 / <span>人员管理</span></span>
      </div>
      <div class="topbar__right">
        <span class="topbar__clock" id="clock">--:--:--</span>
        <button class="topbar__icon-btn" id="topThemeBtn" title="切换主题"><i class="fas fa-moon"></i></button>
        <button class="topbar__icon-btn" id="refreshBtn" title="刷新数据"><i class="fas fa-sync-alt"></i></button>
      </div>
    </header>

    <div class="content">
      <!-- 页面标题 -->
      <div class="page-header">
        <h1 class="page-header__title"><i class="fas fa-users" style="color:#6C3FF5;"></i> 人员管理</h1>
      </div>

      <!-- 区域一：值班人员 -->
      <div class="section-title"><i class="fas fa-id-card"></i> 当前值班人员</div>
      <div class="staff-grid" id="staffGrid"></div>

      <!-- 区域二：操作记录 -->
      <div class="section-title" style="margin-top:20px;"><i class="fas fa-clipboard-list"></i> 操作记录</div>
      <div class="filter-bar2">
        <span>按人员筛选：</span>
        <select id="opFilter"><option value="all">全部人员</option></select>
      </div>
      <div class="device-section" style="margin-bottom:20px;">
        <div class="table-wrapper">
          <table class="data-table">
            <thead><tr><th>时间</th><th>人员</th><th>操作</th><th>设备</th><th>结果</th></tr></thead>
            <tbody id="opLogBody"><tr><td colspan="5" class="empty-row">加载中...</td></tr></tbody>
          </table>
        </div>
      </div>

      <!-- 区域三：绩效图表 -->
      <div class="section-title"><i class="fas fa-chart-bar"></i> 本月产量排行</div>
      <div class="chart-card" style="margin-bottom:20px;">
        <div id="perfChart" class="chart-container"></div>
      </div>
    </div>
  </div>

  <!-- 手机端底部Tab栏 -->
  <nav class="bottom-tab-bar">
    <a href="../index.html" class="tab-item"><span class="tab-icon">📊</span><span>总览</span></a>
    <a href="detail.html" class="tab-item"><span class="tab-icon">⚙️</span><span>设备</span></a>
    <a href="alarms.html" class="tab-item"><span class="tab-icon">🔔</span><span>告警</span></a>
    <a href="personnel.html" class="tab-item active"><span class="tab-icon">👤</span><span>人员</span></a>
  </nav>

  <!-- JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script>
    var posMap={'车间主管':'admin','设备工程师':'engineer','操作员':'operator'};
    function loadStaff(){
      getStaff().then(function(s){
        var c=document.getElementById('staffGrid');if(!c||!s)return;
        c.innerHTML=s.map(function(x){var cls=posMap[x.position]||'operator';return '<div class="staff-card"><div class="staff-card__name">'+x.name+'</div><span class="staff-card__badge '+cls+'">'+x.position+'</span><div class="staff-card__info"><i class="fas fa-clock"></i> '+(x.shift||'--')+'<br><i class="fas fa-phone"></i> '+(x.phone||'--')+'</div></div>';}).join('');
      }).catch(function(e){console.error(e);});
    }
    function loadOpLog(p){
      getOpLog(p&&p!=='all'?{person:p}:{}).then(function(r){
        var t=document.getElementById('opLogBody');if(!t)return;
        if(!r||!r.length){t.innerHTML='<tr><td colspan="5" class="empty-row">暂无记录</td></tr>';return;}
        t.innerHTML=r.map(function(x){var d=x.result==='异常'||x.result==='失败'?' style="color:var(--color-danger);"':'';return '<tr><td>'+x.time+'</td><td>'+x.person+'</td><td>'+x.action+'</td><td>'+x.device+'</td><td'+d+'>'+x.result+'</td></tr>';}).join('');
      }).catch(function(e){console.error(e);});
    }
    function loadPerf(){
      getPerformance().then(function(d){
        var dom=document.getElementById('perfChart');
        if(!dom||!d||!d.length) return;
        
        // 延迟 200ms 执行渲染，确保 DOM 容器已经完全渲染好
        setTimeout(function() {
          var chart = echarts.getInstanceByDom(dom) || echarts.init(dom, 'dark');
          chart.setOption({
            tooltip:{trigger:'axis',formatter:function(p){return p[0].axisValue+'<br/>产量: '+p[0].value+' 件';}},
            grid:{left:85,right:20,top:30,bottom:30,containLabel:true},
            xAxis:{type:'category',data:d.map(function(x){return x.name;}),axisLine:{lineStyle:{color:'#2a3a5c'}},axisLabel:{color:'#8899bb'}},
            yAxis:{type:'value',name:'产量（件）',nameLocation:'middle',nameGap:55,nameTextStyle:{color:'#8899bb',fontSize:12},splitLine:{lineStyle:{color:'#1a2335'}},axisLabel:{color:'#8899bb'}},
            series:[{type:'bar',data:d.map(function(x){return x.output;}),itemStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#6C3FF5'},{offset:1,color:'#8b5cf6'}])},barWidth:'50%'}]
          }, true);
          chart.resize();
        }, 200);
      }).catch(function(e){console.error('加载绩效数据失败:',e);});
    }
    document.addEventListener('DOMContentLoaded',function(){
      Promise.all([
        new Promise(function(r){loadStaff();setTimeout(r,200);}),
        new Promise(function(r){loadOpLog();setTimeout(r,200);})
      ]).then(function(){
        if(typeof window.__loaderMarkApiReady==='function') window.__loaderMarkApiReady();
      });
      // 延迟 300ms 执行图表渲染，确保其他 DOM 加载完成
      setTimeout(function() {
        loadPerf();
      }, 300);
      var f=document.getElementById('opFilter');
      if(f){['张伟','李娜','王强','刘洋','陈敏','杨磊','赵静','黄海'].forEach(function(n){var o=document.createElement('option');o.value=n;o.textContent=n;f.appendChild(o);});f.addEventListener('change',function(){loadOpLog(this.value);});}
    });
  </script>
</body>
</html>

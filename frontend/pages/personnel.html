<!DOCTYPE html>
<!-- ============================================================
     页面：人员管理页 (personnel.html)
     用途：管理车间值班人员信息，展示当前值班人员卡片、
           操作记录日志、本月产量绩效排行图表，
           支持新增/删除值班人员。
     所属项目：智能工厂设备监控看板
     ============================================================ -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人员管理 · 智能工厂</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    /* ===== 人员管理页专属样式 ===== */
    .staff-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }  /* 值班人员卡片网格 */
    .staff-card {
      background:var(--bg-card); border:1px solid var(--border-color);
      border-radius:var(--radius-md); padding:16px 18px;
      box-shadow:var(--shadow-card);
      transition:all 0.2s ease; cursor:default;
    }
    .staff-card:hover {
      transform:translateY(-2px);
      box-shadow:0 4px 16px rgba(0,0,0,0.15);
      border-color:var(--brand-purple,#6C3FF5);
    }
    .staff-card__name { font-size:16px; font-weight:600; }
    .staff-card__badge { display:inline-block; padding:2px 10px; border-radius:10px; font-size:12px; font-weight:500; margin:6px 0 8px; }
    .staff-card__badge.admin { background:rgba(108,63,245,0.15); color:#6C3FF5; }
    .staff-card__badge.engineer { background:rgba(0,188,212,0.15); color:#00bcd4; }
    .staff-card__badge.operator { background:rgba(0,230,118,0.15); color:#00e676; }
    .staff-card__info { font-size:13px; color:var(--text-secondary); line-height:1.8; }
    .staff-card__info i { width:18px; text-align:center; margin-right:4px; }
    .filter-bar2 { display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; font-size:13px; color:var(--text-secondary); }
    .filter-bar2 select { padding:6px 12px; background:var(--bg-card); border:1px solid var(--border-color); border-radius:6px; color:var(--text-primary); font-size:13px; outline:none; cursor:pointer; }
    .section-title { font-size:15px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
    .section-title i { color:var(--brand-purple,#6C3FF5); }
    @media (max-width:1023px){ .staff-grid{grid-template-columns:repeat(2,1fr)} }
    @media (max-width:767px){ .staff-grid{grid-template-columns:1fr} }
    @media (max-width:767px){ .user-info-desktop{display:none!important} }
    @media (min-width:768px){ .user-info-desktop{display:block!important} }
    #perfChart { width:100%; height:320px; }
  </style>
</head>
<body>
  <!-- ===== 加载进度条 ===== -->
  <div id="pageLoader" style="position:fixed;inset:0;z-index:99999;background:#0a0e17;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s ease;">
    <div style="width:280px;max-width:80%;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
        <div style="width:40px;height:40px;border:3px solid rgba(108,63,245,0.3);border-top-color:#6C3FF5;border-radius:50%;animation:loaderSpin 0.8s linear infinite;"></div>
        <div><div style="font-size:18px;font-weight:600;color:#e8edf5;">智能看板</div><div style="font-size:13px;color:#6a7588;margin-top:2px;">正在加载...</div></div>
      </div>
      <div style="height:4px;background:#1e293b;border-radius:4px;overflow:hidden;">
        <div id="loaderBar" style="height:100%;width:0%;background:linear-gradient(90deg,#6C3FF5,#8b5cf6);border-radius:4px;transition:width 0.4s ease;"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:#5a6478;margin-top:6px;">
        <span id="loaderStatus">初始化...</span>
        <span id="loaderPercent">0%</span>
      </div>
    </div>
  </div>
  <style>@keyframes loaderSpin{to{transform:rotate(360deg)}}#pageLoader.hide{opacity:0;pointer-events:none}</style>
  <script>
    (function(){var L=document.getElementById('pageLoader'),B=document.getElementById('loaderBar'),S=document.getElementById('loaderStatus'),P=document.getElementById('loaderPercent'),p=0;
    function setP(pct,msg){p=Math.min(pct,100);if(B)B.style.width=p+'%';if(P)P.textContent=p+'%';if(S&&msg)S.textContent=msg;}
    var steps={css:false,fonts:false,dom:false,api:false};
    function check(){if(steps.css&&steps.fonts&&steps.dom&&steps.api){setP(100,'加载完成');setTimeout(function(){L.classList.add('hide')},400);}}
    setP(5,'正在连接...');
    document.querySelectorAll('link[rel="stylesheet"]').forEach(function(l){if(l.sheet){steps.css=true;setP(25,'样式加载完成');check();return;}l.addEventListener('load',function(){steps.css=true;setP(25,'样式加载完成');check();});});
    if(document.readyState!=='loading'){steps.dom=true;setP(35,'页面结构就绪');check();}else document.addEventListener('DOMContentLoaded',function(){steps.dom=true;setP(35,'页面结构就绪');check();});
    if(document.fonts)document.fonts.ready.then(function(){steps.fonts=true;setP(45,'字体就绪');check();});else{steps.fonts=true;setP(45,'');check();}
    window.__loaderMarkApiReady=function(){steps.api=true;setP(80,'数据加载完成');check();};
    setTimeout(function(){if(L&&!L.classList.contains('hide')){setP(100,'加载完成');setTimeout(function(){L.classList.add('hide')},400);}},10000);})();
  </script>
  <!-- ============================================================
       侧边栏导航 - 页面顶部左侧固定导航栏，包含应用 Logo、
       功能模块菜单（总览/设备/告警/人员/设置）及主题切换按钮。
       ============================================================ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="../assets/icons/logo.svg" alt="Logo" class="sidebar-logo">
      <h1 class="sidebar-title">智能看板</h1>
      <button class="sidebar-toggle" id="sidebarToggle">
        <img src="../assets/icons/collapse.svg" alt="折叠">
      </button>
    </div>
    <nav class="sidebar-nav">
      <a href="../index.html" class="nav-item" data-page="dashboard">
        <img src="../assets/icons/dashboard.svg" class="nav-icon">
        <span class="nav-text">总览看板</span>
      </a>
      <a href="detail.html" class="nav-item" data-page="detail">
        <img src="../assets/icons/device.svg" class="nav-icon">
        <span class="nav-text">设备管理</span>
      </a>
      <a href="alarms.html" class="nav-item" data-page="alarms">
        <img src="../assets/icons/alarm.svg" class="nav-icon">
        <span class="nav-text">告警管理</span>
        <span class="nav-badge" id="alarmBadge" style="display:none;">0</span>
      </a>
      <a href="personnel.html" class="nav-item active" data-page="personnel">
        <img src="../assets/icons/user.svg" class="nav-icon">
        <span class="nav-text">人员管理</span>
      </a>
      <a href="templates.html" class="nav-item" data-page="templates">
        <img src="../assets/icons/template.svg" class="nav-icon">
        <span class="nav-text">看板模板</span>
      </a>
      <a href="publish.html" class="nav-item" data-page="publish">
        <img src="../assets/icons/publish.svg" class="nav-icon">
        <span class="nav-text">发布管理</span>
      </a>
      <a href="settings.html" class="nav-item" data-page="settings">
        <img src="../assets/icons/settings.svg" class="nav-icon">
        <span class="nav-text">系统设置</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon" id="themeIcon"></i>
        <span class="theme-label">暗色主题</span>
      </button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ============================================================
       主内容区 - 包含顶部导航栏 (topbar) 和人员管理内容区域。
       ============================================================ -->
  <div class="main" id="mainContent">
    <header class="topbar">
      <div class="topbar__left">
        <span class="topbar__hamburger" id="menuBtn"><i class="fas fa-bars"></i></span>
        <span class="topbar__breadcrumb">首页 / <span>人员管理</span></span>
      </div>
      <div class="topbar__right">
        <span class="topbar__clock" id="clock">--:--:--</span>
        <button class="topbar__icon-btn" id="topThemeBtn" title="切换主题"><i class="fas fa-moon"></i></button>
        <button class="topbar__icon-btn" id="refreshBtn" title="刷新数据"><i class="fas fa-sync-alt"></i></button>
        <div class="topbar__user" id="userAvatar" title="用户信息" style="display:flex;align-items:center;gap:6px;cursor:pointer;">
          <div style="width:32px;height:32px;border-radius:50%;background:var(--brand-purple,#6C3FF5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;">A</div>
          <div style="text-align:left;line-height:1.3;display:none;" class="user-info-desktop">
            <div id="userNameDisplay" style="font-size:13px;font-weight:600;color:var(--text-primary);">用户</div>
            <div id="userRoleDisplay" style="font-size:11px;color:var(--text-muted);">普通员工</div>
          </div>
        </div>
      </div>
    </header>

    <div class="content">
      <!-- ===== 页面标题：人员管理 ===== -->
      <div class="page-header">
        <h1 class="page-header__title"><i class="fas fa-users" style="color:#6C3FF5;"></i> 人员管理</h1>
      </div>

      <!-- ============================================================
           区域一：当前值班人员卡片网格 + 新增人员按钮
           ============================================================ -->
      <div class="section-title" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;">
        <span><i class="fas fa-id-card"></i> 当前值班人员</span>
        <button id="addStaffBtn" style="font-size:12px;padding:6px 14px;background:var(--brand-purple,#6C3FF5);color:#fff;border:none;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:4px;" data-role-required="workshop_supervisor,dashboard_admin"><i class="fas fa-plus"></i> 新增人员</button>
      </div>
      <div class="staff-grid" id="staffGrid"></div>

      <!-- ============================================================
           区域二：操作记录表格 - 按人员筛选，展示操作时间、人员、
           操作内容、设备及结果
           ============================================================ -->
      <div class="section-title" style="margin-top:20px;"><i class="fas fa-clipboard-list"></i> 操作记录</div>
      <div class="filter-bar2">
        <span>按人员筛选：</span>
        <select id="opFilter"><option value="all">全部人员</option></select>
      </div>
      <div class="device-section" style="margin-bottom:20px;">
        <div class="table-wrapper">
          <table class="data-table">
            <thead><tr><th>时间</th><th>人员</th><th>操作</th><th>设备</th><th>结果</th></tr></thead>
            <tbody id="opLogBody"><tr><td colspan="5" class="empty-row">加载中...</td></tr></tbody>
          </table>
        </div>
      </div>

      <!-- ============================================================
           区域三：本月产量排行柱状图（ECharts）
           ============================================================ -->
      <div class="section-title"><i class="fas fa-chart-bar"></i> 本月产量排行</div>
      <div class="chart-card" style="margin-bottom:20px;">
        <div id="perfChart" class="chart-container"></div>
      </div>
    </div>
  </div>

  <!-- ============================================================
       新增人员弹窗 (Modal)：填写姓名、岗位、班次、联系电话
       等基本信息后提交添加值班人员。
       ============================================================ -->
  <div id="addStaffModal" style="display:none;position:fixed;inset:0;z-index:99998;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;" onclick="if(event.target===this)closeAddStaff()">
    <div style="background:var(--bg-card,#141b2d);border:1px solid var(--border-color,#1e293b);border-radius:12px;padding:28px;width:90%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,0.4);" onclick="event.stopPropagation()">
      <h3 style="margin:0 0 20px;font-size:18px;display:flex;align-items:center;gap:8px;"><i class="fas fa-user-plus" style="color:#6C3FF5;"></i> 新增值班人员</h3>
      <div style="display:flex;flex-direction:column;gap:14px;">
        <input id="sf_name" placeholder="姓名" style="padding:10px 14px;background:var(--bg-secondary,#0f172a);border:1px solid var(--border-color,#1e293b);border-radius:8px;color:var(--text-primary,#e8edf5);font-size:14px;outline:none;">
        <select id="sf_position" style="padding:10px 14px;background:var(--bg-secondary,#0f172a);border:1px solid var(--border-color,#1e293b);border-radius:8px;color:var(--text-primary,#e8edf5);font-size:14px;outline:none;">
          <option value="">-- 请选择岗位 --</option>
          <option value="车间主管">车间主管</option>
          <option value="设备工程师">设备工程师</option>
          <option value="操作员">操作员</option>
        </select>
        <select id="sf_shift" style="padding:10px 14px;background:var(--bg-secondary,#0f172a);border:1px solid var(--border-color,#1e293b);border-radius:8px;color:var(--text-primary,#e8edf5);font-size:14px;outline:none;">
          <option value="">-- 请选择班次 --</option>
          <option value="白班 08:00-20:00">白班 08:00-20:00</option>
          <option value="夜班 20:00-08:00">夜班 20:00-08:00</option>
        </select>
        <input id="sf_phone" placeholder="联系电话" style="padding:10px 14px;background:var(--bg-secondary,#0f172a);border:1px solid var(--border-color,#1e293b);border-radius:8px;color:var(--text-primary,#e8edf5);font-size:14px;outline:none;">
      </div>
      <div style="display:flex;gap:10px;margin-top:20px;">
        <button onclick="closeAddStaff()" style="flex:1;padding:10px;border:1px solid var(--border-color,#1e293b);border-radius:8px;background:transparent;color:var(--text-secondary,#8899bb);cursor:pointer;font-size:14px;">取消</button>
        <button id="confirmAddStaff" onclick="submitAddStaff()" style="flex:1;padding:10px;border:none;border-radius:8px;background:#6C3FF5;color:#fff;cursor:pointer;font-size:14px;font-weight:600;">确认添加</button>
      </div>
    </div>
  </div>

  <!-- ============================================================
       手机端底部 Tab 导航栏：移动设备上替代侧边栏，
       提供总览/设备/告警/人员四个页面的快速切换。
       ============================================================ -->
  <nav class="bottom-tab-bar">
    <a href="../index.html" class="tab-item"><span class="tab-icon">📊</span><span>总览</span></a>
    <a href="detail.html" class="tab-item"><span class="tab-icon">⚙️</span><span>设备</span></a>
    <a href="alarms.html" class="tab-item"><span class="tab-icon">🔔</span><span>告警</span></a>
    <a href="personnel.html" class="tab-item active"><span class="tab-icon">👤</span><span>人员</span></a>
  </nav>

  <!-- ============================================================
       页面级 JavaScript
       引入 ECharts 图表库和公共模块后，在此定义人员管理页
       特有的数据加载与渲染逻辑。
       ============================================================ -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script>
    // ============================================================
    // 岗位 CSS 映射：将中文岗位名映射到卡片徽章的样式类
    // ============================================================
    var posMap={'车间主管':'admin','设备工程师':'engineer','操作员':'operator'};
    // ============================================================
    // 加载并渲染值班人员卡片网格
    // ============================================================
    function loadStaff(){
      var canManage = hasRole('workshop_supervisor') || hasRole('dashboard_admin');
      getStaff().then(function(s){
        var c=document.getElementById('staffGrid');if(!c||!s)return;
        c.innerHTML=s.map(function(x){var cls=posMap[x.position]||'operator';return '<div class="staff-card"><div class="staff-card__name">'+x.name+'</div><span class="staff-card__badge '+cls+'">'+x.position+'</span><div class="staff-card__info"><i class="fas fa-clock"></i> '+(x.shift||'--')+'<br><i class="fas fa-phone"></i> '+(x.phone||'--')+'</div>'+(canManage?'<button onclick="deleteStaffMember('+x.id+')" title="删除" style="margin-top:8px;padding:4px 10px;border:1px solid var(--color-danger,#f44336);border-radius:6px;background:transparent;color:var(--color-danger,#f44336);font-size:11px;cursor:pointer;"><i class="fas fa-trash"></i> 删除</button>':'')+'</div>';}).join('');
      }).catch(function(e){console.error(e);});
    }
    // ============================================================
    // 重新加载人员卡片并更新操作记录筛选下拉框
    // ============================================================
    function reloadStaffAndFilter(){
      loadStaff();
      getStaff().then(function(list){
        var f=document.getElementById('opFilter');
        if(!f)return;
        var cur=f.value;
        f.innerHTML='<option value="all">全部人员</option>';
        if(list&&list.length)list.forEach(function(x){var o=document.createElement('option');o.value=x.name;o.textContent=x.name;if(x.name===cur)o.selected=true;f.appendChild(o);});
      }).catch(function(){});
    }
    // ============================================================
    // 打开/关闭新增人员弹窗，关闭时重置表单字段
    // ============================================================
    function openAddStaff(){document.getElementById('addStaffModal').style.display='flex';document.getElementById('sf_name').focus();}
    function closeAddStaff(){document.getElementById('addStaffModal').style.display='none';document.getElementById('sf_name').value='';document.getElementById('sf_position').value='';document.getElementById('sf_shift').value='';document.getElementById('sf_phone').value='';}
    // ============================================================
    // 提交新增人员表单：校验必填项 -> 调用 API -> 成功后刷新列表
    // ============================================================
    function submitAddStaff(){
      var name=document.getElementById('sf_name').value.trim(),position=document.getElementById('sf_position').value,shift=document.getElementById('sf_shift').value,phone=document.getElementById('sf_phone').value.trim();
      if(!name){alert('请输入姓名');return;}if(!position){alert('请选择岗位');return;}
      var btn=document.getElementById('confirmAddStaff');btn.textContent='添加中...';btn.disabled=true;
      addStaff({name:name,position:position,shift:shift,phone:phone}).then(function(r){
        if(r&&r.success!==false){closeAddStaff();reloadStaffAndFilter();showToast&&showToast('✅ 人员 "'+name+'" 添加成功');}
        else{alert('添加失败：'+(r&&r.message||'未知错误'));}
      }).catch(function(e){alert('添加失败：'+e.message);}).finally(function(){btn.textContent='确认添加';btn.disabled=false;});
    }
    // ============================================================
    // 删除指定值班人员（带确认提示）
    // ============================================================
    function deleteStaffMember(id){
      if(!confirm('确定要删除该人员吗？'))return;
      deleteStaff(id).then(function(r){
        if(r&&r.success!==false){reloadStaffAndFilter();showToast&&showToast('✅ 人员已删除');}
        else{alert('删除失败：'+(r&&r.message||'未知错误'));}
      }).catch(function(e){alert('删除失败：'+e.message);});
    }
    // ============================================================
    // 加载操作记录日志（可按人员筛选）
    // 参数 p: 人员姓名，'all' 表示显示全部
    // ============================================================
    function loadOpLog(p){
      getOpLog(p&&p!=='all'?{person:p}:{}).then(function(r){
        var t=document.getElementById('opLogBody');if(!t)return;
        if(!r||!r.length){t.innerHTML='<tr><td colspan="5" class="empty-row">暂无记录</td></tr>';return;}
        t.innerHTML=r.map(function(x){var d=x.result==='异常'||x.result==='失败'?' style="color:var(--color-danger);"':'';return '<tr><td>'+x.time+'</td><td>'+x.person+'</td><td>'+x.action+'</td><td>'+x.device+'</td><td'+d+'>'+x.result+'</td></tr>';}).join('');
      }).catch(function(e){console.error(e);});
    }
    // ============================================================
    // 加载并渲染本月产量排行柱状图（使用 ECharts）
    // 添加 200ms 延迟确保 DOM 容器渲染完成
    // ============================================================
    function loadPerf(){
      getPerformance().then(function(d){
        var dom=document.getElementById('perfChart');
        if(!dom||!d||!d.length) return;
        
        // 延迟 200ms 执行渲染，确保 DOM 容器已经完全渲染好
        setTimeout(function() {
          var chart = echarts.getInstanceByDom(dom) || echarts.init(dom, 'dark');
          chart.setOption({
            tooltip:{trigger:'axis',formatter:function(p){return p[0].axisValue+'<br/>产量: '+p[0].value+' 件';}},
            grid:{left:85,right:20,top:30,bottom:30,containLabel:true},
            xAxis:{type:'category',data:d.map(function(x){return x.name;}),axisLine:{lineStyle:{color:'#2a3a5c'}},axisLabel:{color:'#8899bb'}},
            yAxis:{type:'value',name:'产量（件）',nameLocation:'middle',nameGap:55,nameTextStyle:{color:'#8899bb',fontSize:12},splitLine:{lineStyle:{color:'#1a2335'}},axisLabel:{color:'#8899bb'}},
            series:[{type:'bar',data:d.map(function(x){return x.output;}),itemStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#6C3FF5'},{offset:1,color:'#8b5cf6'}])},barWidth:'50%'}]
          }, true);
          chart.resize();
        }, 200);
      }).catch(function(e){console.error('加载绩效数据失败:',e);});
    }
    // ============================================================
    // DOM 初始化：加载值班人员、操作记录、绩效图表，
    // 绑定新增人员和筛选事件，最后标记 API 数据就绪。
    // ============================================================
    document.addEventListener('DOMContentLoaded',function(){
      Promise.all([
        new Promise(function(r){loadStaff();setTimeout(r,200);}),
        new Promise(function(r){loadOpLog();setTimeout(r,200);})
      ]).then(function(){
        if(typeof window.__loaderMarkApiReady==='function') window.__loaderMarkApiReady();
      });
      // 延迟 300ms 执行图表渲染，确保其他 DOM 加载完成
      setTimeout(function() {
        loadPerf();
      }, 300);
      // 动态加载人员下拉选项
      reloadStaffAndFilter();
      // 根据角色隐藏/显示需要权限的元素
      var addBtn=document.getElementById('addStaffBtn');
      if(addBtn){
        var rolesRequired=(addBtn.dataset.roleRequired||'').split(',');
        var hasAccess=rolesRequired.some(function(r){return hasRole(r);});
        if(!hasAccess) addBtn.style.display='none';
        else addBtn.addEventListener('click',openAddStaff);
      }
      document.getElementById('opFilter').addEventListener('change',function(){loadOpLog(this.value);});
    });
  </script>
</body>
</html>

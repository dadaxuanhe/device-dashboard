<!DOCTYPE html>
<!-- ============================================================
     页面：看板展示页 (display.html)
     用途：大屏终端看板展示，隐藏侧边栏和顶部栏，根据看板布局
           类型动态渲染网格，支持数据卡片/实时表格/趋势图/
           告警列表/进度条等组件，自动刷新数据。
     所属项目：智能工厂设备监控看板
     ============================================================ -->
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>看板展示 · 智能工厂</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0a0e17; color:#e8edf5; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
    #displayContainer { width:100vw; height:100vh; display:flex; flex-direction:column; }
    .display-header { display:flex; justify-content:space-between; align-items:center; padding:16px 24px; background:rgba(15,23,42,0.95); border-bottom:1px solid rgba(42,58,92,0.5); flex-shrink:0; }
    .display-header h1 { font-size:24px; font-weight:600; color:#e8edf5; }
    .display-header .time { font-size:18px; color:#6a7588; font-variant-numeric:tabular-nums; }
    .display-body { flex:1; padding:16px; overflow:hidden; }
    .display-grid { display:grid; gap:12px; height:100%; grid-auto-rows:1fr; }
    .display-grid.single { grid-template-columns:1fr; }
    .display-grid.double { grid-template-columns:1fr 1fr; }
    .display-grid.triple { grid-template-columns:1fr 1fr 1fr; }
    .display-grid.mixed { grid-template-columns:2fr 1fr; }

    .display-cell {
      background:rgba(15,23,42,0.8); border:1px solid rgba(42,58,92,0.4); border-radius:10px;
      padding:12px 14px; display:flex; flex-direction:column; overflow:hidden; min-height:0;
    }
    .display-cell .cell-title { font-size:13px; font-weight:600; color:#8899bb; margin-bottom:6px; flex-shrink:0; }
    .display-cell .cell-body { flex:1; overflow:hidden; display:flex; align-items:center; justify-content:center; min-height:0; }

    /* 数据卡片样式 */
    .kpi-value { font-size:32px; font-weight:700; color:#e8edf5; line-height:1.2; }
    .kpi-label { font-size:12px; color:#6a7588; margin-top:2px; }
    .kpi-unit { font-size:14px; font-weight:400; color:#6a7588; margin-left:2px; }

    /* 表格样式 */
    .display-table { width:100%; border-collapse:collapse; font-size:12px; }
    .display-table th { text-align:left; padding:5px 4px; color:#6a7588; border-bottom:1px solid rgba(42,58,92,0.3); font-weight:500; font-size:11px; }
    .display-table td { padding:4px; color:#e8edf5; border-bottom:1px solid rgba(42,58,92,0.15); font-size:12px; }
    .display-table tr:last-child td { border-bottom:none; }

    /* 告警列表 */
    .alarm-item { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid rgba(42,58,92,0.15); font-size:13px; }
    .alarm-item:last-child { border-bottom:none; }
    .alarm-level { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .alarm-level.critical { background:#ff1744; }
    .alarm-level.warning { background:#ff9100; }
    .alarm-level.info { background:#ffd740; }

    /* 进度条 */
    .progress-wrap { width:100%; }
    .progress-bar { width:100%; height:20px; background:rgba(42,58,92,0.5); border-radius:10px; overflow:hidden; }
    .progress-fill { height:100%; border-radius:10px; transition:width 1s ease; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:#fff; }

    /* 加载/错误状态 */
    .loading-state, .error-state { display:flex; align-items:center; justify-content:center; height:100%; color:#6a7588; font-size:14px; }
    .error-state { color:#ff1744; }

    /* ========== 三端自适应 ========== */
    /* 平板 (< 1024px) */
    @media (max-width:1023px) {
      .display-grid.double { grid-template-columns:1fr 1fr; }
      .display-grid.triple { grid-template-columns:1fr 1fr; }
      .display-grid.mixed { grid-template-columns:1fr 1fr; }
      .display-header h1 { font-size:20px; }
      .display-header { padding:12px 16px; }
      .kpi-value { font-size:26px; }
      .display-body { padding:10px; }
      .display-grid { gap:8px; }
    }
    /* 手机 (< 768px) */
    @media (max-width:767px) {
      .display-grid.double,
      .display-grid.triple,
      .display-grid.mixed { grid-template-columns:1fr; }
      .display-header h1 { font-size:16px; }
      .display-header .time { font-size:14px; }
      .display-header { padding:10px 12px; }
      .display-header #fullscreenToggle,
      .display-header #exitDisplayBtn { font-size:11px; padding:4px 10px; }
      .kpi-value { font-size:22px; }
      .display-cell { padding:8px 10px; border-radius:8px; }
      .display-cell .cell-title { font-size:11px; }
      .display-body { padding:8px; }
      .display-grid { gap:6px; }
      .display-table { font-size:11px; }
      .display-table th, .display-table td { padding:3px 2px; }
    }
  </style>
</head>
<body>
  <div id="displayContainer">
    <div class="display-header">
      <h1 id="displayTitle">智能工厂看板</h1>
      <div style="display:flex;align-items:center;gap:12px;">
        <button id="fullscreenToggle" style="padding:6px 14px;border:1px solid rgba(42,58,92,0.5);background:rgba(15,23,42,0.8);border-radius:6px;color:#8899bb;cursor:pointer;font-size:13px;transition:all 0.2s;" title="全屏模式"><i class="fas fa-expand"></i> 全屏</button>
        <button id="exitDisplayBtn" style="padding:6px 14px;border:1px solid rgba(255,23,68,0.3);background:rgba(255,23,68,0.1);border-radius:6px;color:#ff1744;cursor:pointer;font-size:13px;transition:all 0.2s;" title="退出展示"><i class="fas fa-times"></i> 退出</button>
        <div class="time" id="displayTime">--:--:--</div>
      </div>
    </div>
    <div class="display-body">
      <div id="displayContent" class="display-grid single">
        <div class="display-cell">
          <div class="cell-title">加载中</div>
          <div class="cell-body loading-state"><i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i> 正在加载看板数据...</div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script>
    var currentInstance = null;
    var refreshTimer = null;
    var chartInstances = {};

    // ============================
    // 获取实例ID
    // ============================
    function getInstanceId() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('instance_id');
      var tid = params.get('template_id');
      var assigned = params.get('assigned');
      if (id) return { type: 'instance', id: parseInt(id) };
      if (tid) return { type: 'template', id: parseInt(tid) };
      if (assigned) return { type: 'assigned' };
      return null;
    }

    // ============================
    // 加载渲染数据
    // ============================
    async function loadDisplay() {
      var info = getInstanceId();
      if (!info) {
        document.getElementById('displayTitle').textContent = '参数错误';
        document.getElementById('displayContent').innerHTML = '<div class="display-cell"><div class="cell-title">错误</div><div class="cell-body error-state">请通过 URL 参数指定 instance_id 或 template_id</div></div>';
        return;
      }
      try {
        var data;
        if (info.type === 'assigned') {
          data = await request('/my-assigned-board');
          var renderData = await getBoardRenderData(data.id);
          renderData.name = data.name;
          renderData.layout_type = data.layout_type;
          renderData.refresh_interval = data.refresh_interval || 30;
          data = renderData;
          // 员工模式自动全屏
          setTimeout(function() {
            if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
              document.documentElement.requestFullscreen().catch(function() {});
            }
          }, 1000);
        } else if (info.type === 'instance') {
          data = await getBoardRenderData(info.id);
        } else {
          // 模板预览模式：直接加载模板详情
          data = await getBoardTemplateDetail(info.id);
          data.layout_type = data.layout_type || 'single';
          data.template_config = data.config || {};
          data.refresh_interval = 30;
        }
        currentInstance = data;
        document.getElementById('displayTitle').textContent = data.name || data.template_name || '看板展示';
        renderDisplay(data);
        // 启动自动刷新
        var interval = parseInt(localStorage.getItem('dashboard_refreshInterval')) || (data.refresh_interval || 30) * 1000;
        if (refreshTimer) clearInterval(refreshTimer);
        refreshTimer = setInterval(function() {
          loadDisplay();
        }, interval);
      } catch(e) {
        document.getElementById('displayContent').innerHTML = '<div class="display-cell"><div class="cell-title">错误</div><div class="cell-body error-state"><i class="fas fa-exclamation-circle" style="margin-right:8px;"></i> ' + e.message + '</div></div>';
      }
    }

    // ============================
    // 渲染看板
    // ============================
    function renderDisplay(data) {
      chartInstances = {};
      var layout = data.template_config?.layout_type || data.layout_type || 'single';
      var grid = document.getElementById('displayContent');
      grid.className = 'display-grid ' + layout;

      var comps = data.components || [];
      if (comps.length === 0) {
        grid.innerHTML = '<div class="display-cell"><div class="cell-title">提示</div><div class="cell-body loading-state">此看板暂无组件</div></div>';
        return;
      }

      grid.innerHTML = comps.map(function(c, idx) {
        var cfg = Object.assign({}, c.default_config || {}, c.config || {});
        var title = cfg.title || c.comp_name || '组件';
        var pos = c.position || {};
        var colSpan = pos.width > 1 ? ' style="grid-column:span ' + pos.width + ';"' : '';
        var compType = c.comp_type || c.type || '';
        return '<div class="display-cell" data-comp-idx="' + idx + '" data-comp-type="' + compType + '" data-config=\'' + JSON.stringify(cfg).replace(/'/g,"&#39;") + '\'' + colSpan + '>' +
          '<div class="cell-title">' + title + '</div>' +
          '<div class="cell-body" id="compBody_' + idx + '"><div class="loading-state">加载中...</div></div>' +
        '</div>';
      }).join('');

      // 异步填充数据
      setTimeout(function() { fillComponents(data); }, 100);
    }

    async function fillComponents(data) {
      var comps = data.components || [];
      for (var i = 0; i < comps.length; i++) {
        var c = comps[i];
        var cfg = Object.assign({}, c.default_config || {}, c.config || {});
        var body = document.getElementById('compBody_' + i);
        if (!body) continue;
        // 兼容 API 返回的字段名：comp_type（SQL别名）或 type（原始字段）
        var compType = c.comp_type || c.type || '';
        try {
          switch (compType) {
            case 'data_card':
              await renderDataCard(body, cfg);
              break;
            case 'real_table':
              await renderRealTable(body, cfg);
              break;
            case 'trend_chart':
              renderTrendChart(body, cfg, i);
              break;
            case 'alarm_list':
              await renderAlarmList(body, cfg);
              break;
            case 'progress_bar':
              await renderProgressBar(body, cfg);
              break;
            default:
              body.innerHTML = '<div class="error-state">未知组件类型: ' + c.type + '</div>';
          }
        } catch(e) {
          body.innerHTML = '<div class="error-state">加载失败</div>';
        }
      }
    }

    // ============================
    // 组件渲染函数
    // ============================
    async function renderDataCard(body, cfg) {
      var dataSource = cfg.dataSource || 'stats';
      var data = await request('/dashboard/' + dataSource);
      // 如果指定了具体 valueKey，显示单个 KPI
      if (cfg.valueKey) {
        var value = data[cfg.valueKey] ?? '--';
        var unit = cfg.unit || '';
        body.innerHTML =
          '<div style="text-align:center;">' +
            '<div class="kpi-value">' + value + '<span class="kpi-unit">' + unit + '</span></div>' +
            '<div class="kpi-label">' + (cfg.label || cfg.valueKey) + '</div>' +
          '</div>';
        return;
      }
      // 未指定 valueKey 时，展示所有统计指标
      var fieldLabels = {
        total: '设备总数', running: '运行中', idle: '空闲中',
        fault: '故障中', offline: '离线',
        alarmCount: '活跃告警', todayOutput: '今日产量', avgOee: 'OEE 稼动率'
      };
      var fieldUnits = {
        total: '台', running: '台', idle: '台', fault: '台', offline: '台',
        alarmCount: '条', todayOutput: '', avgOee: '%'
      };
      body.innerHTML =
        '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;width:100%;">' +
        Object.keys(fieldLabels).map(function(k) {
          var v = data[k] ?? '--';
          var u = fieldUnits[k] || '';
          return '<div style="text-align:center;padding:6px 4px;background:rgba(108,63,245,0.06);border-radius:6px;border:1px solid rgba(42,58,92,0.3);">' +
            '<div style="font-size:22px;font-weight:700;color:#e8edf5;line-height:1.3;">' + v + '<span style="font-size:11px;font-weight:400;color:#6a7588;margin-left:2px;">' + u + '</span></div>' +
            '<div style="font-size:10px;color:#6a7588;margin-top:1px;">' + fieldLabels[k] + '</div>' +
          '</div>';
        }).join('') +
        '</div>';
    }

    async function renderRealTable(body, cfg) {
      var dataSource = cfg.dataSource || 'equipment';
      var pageSize = cfg.pageSize || 5;
      var data = await request('/' + dataSource);
      if (!data || data.length === 0) {
        body.innerHTML = '<div class="loading-state">暂无数据</div>';
        return;
      }
      var items = data.slice(0, pageSize);
      // 字段名 → 中文标签映射
      var fieldLabels = {
        id: '序号', equipmentNo: '设备编号', name: '设备名称', type: '设备类型',
        status: '状态', location: '位置', model: '型号',
        temperature: '温度(℃)', humidity: '湿度(%)', voltage: '电压(V)', current: '电流(A)',
        power: '功率(kW)', output_count: '产量', reject_count: '不良品'
      };
      var keys = Object.keys(items[0] || {}).slice(0, 4);
      body.innerHTML =
        '<div style="width:100%;overflow:auto;">' +
        '<table class="display-table">' +
          '<tr>' + keys.map(function(k) { return '<th>' + (fieldLabels[k] || k) + '</th>'; }).join('') + '</tr>' +
          items.map(function(item) {
            return '<tr>' + keys.map(function(k) {
              var v = item[k];
              if (v === null || v === undefined) v = '--';
              // 状态字段着色
              if (k === 'status') {
                var statusColors = { online:'#00e676', warning:'#ffd740', error:'#ff1744', offline:'#6a7588' };
                var sc = statusColors[v] || '#6a7588';
                var statusLabels = { online:'运行中', warning:'告警中', error:'故障', offline:'离线' };
                v = '<span style="color:' + sc + ';">● ' + (statusLabels[v] || v) + '</span>';
              }
              return '<td>' + v + '</td>';
            }).join('') + '</tr>';
          }).join('') +
        '</table></div>';
    }

    function renderTrendChart(body, cfg, idx) {
      var chartDom = document.createElement('div');
      chartDom.style.cssText = 'width:100%;height:100%;min-height:200px;';
      body.innerHTML = '';
      body.appendChild(chartDom);

      if (typeof echarts === 'undefined') {
        body.innerHTML = '<div class="error-state">ECharts 未加载</div>';
        return;
      }
      var myChart = echarts.init(chartDom, 'dark');
      chartInstances['chart_' + idx] = myChart;

      // 加载数据
      var dataSource = cfg.dataSource || 'production';
      var range = cfg.range || '7d';
      request('/' + dataSource + '?range=' + range).then(function(data) {
        if (!data || data.length === 0) {
          body.innerHTML = '<div class="loading-state">暂无数据</div>';
          return;
        }
        var dates = data.map(function(d) { return d.date || d.record_date || ''; });
        var values = data.map(function(d) { return d.actualQuantity || d.output_count || d.value || 0; });
        myChart.setOption({
          tooltip: { trigger:'axis' },
          grid: { left:40, right:10, top:20, bottom:25 },
          xAxis: { type:'category', data:dates, axisLabel:{ color:'#6a7588', fontSize:10 } },
          yAxis: { type:'value', splitLine:{ lineStyle:{ color:'rgba(42,58,92,0.3)' } }, axisLabel:{ color:'#6a7588' } },
          series: [{ type:'line', data:values, smooth:true, lineStyle:{ width:2, color:'#6C3FF5' }, areaStyle:{ color:{ type:'linear', x:0,y:0,x2:0,y2:1, colorStops:[{offset:0,color:'rgba(108,63,245,0.3)'},{offset:1,color:'rgba(108,63,245,0)'}] } } }]
        });
        myChart.resize();
      }).catch(function() {
        body.innerHTML = '<div class="error-state">数据加载失败</div>';
      });
    }

    async function renderAlarmList(body, cfg) {
      var maxItems = cfg.maxItems || 5;
      var data = await request('/alarms/active');
      if (!data || data.length === 0) {
        body.innerHTML = '<div style="text-align:center;color:#6a7588;font-size:14px;">✅ 当前无活跃告警</div>';
        return;
      }
      var items = data.slice(0, maxItems);
      var levelLabels = { critical:'紧急', warning:'警告', info:'提示' };
      body.innerHTML = '<div style="width:100%;overflow:auto;">' +
        items.map(function(a) {
          var lv = a.level || 'info';
          var lvColor = lv === 'critical' ? '#ff1744' : lv === 'warning' ? '#ff9100' : '#ffd740';
          var timeStr = (a.occurredAt || '').replace('T', ' ').slice(0, 16);
          return '<div class="alarm-item" style="padding:4px 0;font-size:12px;">' +
            '<span class="alarm-level ' + lv + '" style="background:' + lvColor + ';width:6px;height:6px;"></span>' +
            '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' +
              '<span style="font-weight:500;color:#e8edf5;font-size:12px;">' + (a.equipmentName||'') + '</span>' +
              '<span style="color:#6a7588;margin:0 3px;">|</span>' +
              '<span style="font-size:12px;">' + (a.content||a.title||'') + '</span>' +
            '</span>' +
            '<span style="font-size:10px;color:#6a7588;flex-shrink:0;">' + timeStr + '</span>' +
          '</div>';
        }).join('') +
      '</div>';
    }

    async function renderProgressBar(body, cfg) {
      var dataSource = cfg.dataSource || 'oee';
      var maxValue = cfg.maxValue || 100;
      var data = await request('/dashboard/' + dataSource);
      var value = typeof data === 'object' ? (data.overall || data.avgOee || data.value || 0) : (data || 0);
      var pct = Math.min(Math.round(value / maxValue * 100), 100);
      var color = pct >= 85 ? '#00e676' : pct >= 70 ? '#ffd740' : pct >= 60 ? '#ff9100' : '#ff1744';
      // 根据数据源显示更友好的标签
      var labelMap = { oee:'设备综合效率', production:'产能完成率', utilization:'设备利用率' };
      var label = cfg.label || labelMap[dataSource] || '完成率';
      // 显示实际值/最大值
      var detailStr = '';
      if (dataSource === 'oee') {
        detailStr = '<span style="font-size:11px;color:#6a7588;margin-left:4px;">(' + value + '%)</span>';
      }
      body.innerHTML =
        '<div class="progress-wrap">' +
          '<div style="display:flex;justify-content:space-between;margin-bottom:4px;">' +
            '<span style="font-size:13px;color:#e8edf5;">' + label + detailStr + '</span>' +
            '<span style="font-size:13px;font-weight:600;color:' + color + ';">' + pct + '%</span>' +
          '</div>' +
          '<div class="progress-bar" style="height:16px;"><div class="progress-fill" style="width:' + pct + '%;background:' + color + ';font-size:11px;">' + pct + '%</div></div>' +
        '</div>';
    }

    // ============================================================
    // 时钟：每秒更新右上角时间显示
    // ============================================================
    function updateClock() {
      var now = new Date();
      document.getElementById('displayTime').textContent = now.toLocaleString('zh-CN', { hour12:false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ============================================================
    // 心跳检测（终端在线状态上报）
    // 每 30 秒向后端报告当前终端在线状态
    // 根据视口宽度判断设备类型（pc/tablet/mobile）
    // ============================================================
    function getDeviceType() {
      var w = window.innerWidth;
      if (w >= 1024) return 'pc';
      if (w >= 768) return 'tablet';
      return 'mobile';
    }
    async function sendHeartbeat() {
      var user = (function(){ try{ return JSON.parse(sessionStorage.getItem('userInfo')||'{}'); }catch(e){return {};} })();
      if (!user.id) return;
      try {
        await fetch('/api/terminal/heartbeat', {
          method: 'POST',
          headers: { 'Content-Type':'application/json', 'X-User-Id': user.id },
          body: JSON.stringify({ device_type: getDeviceType() })
        });
      } catch(e) { /* 静默失败，不影响展示 */ }
    }
    sendHeartbeat();
    setInterval(sendHeartbeat, 30000);

    // ============================================================
    // 页面可见性变化 → 实时更新在线状态
    // 隐藏时发送离线信号，回到页面时重新发送心跳
    // ============================================================
    function sendOffline() {
      var user = (function(){ try{ return JSON.parse(sessionStorage.getItem('userInfo')||'{}'); }catch(e){return {};} })();
      if (!user.id) return;
      try {
        fetch('/api/terminal/offline', {
          method: 'POST', keepalive: true,         /* keepalive 确保请求在页面关闭前发出 */
          headers: { 'Content-Type':'application/json', 'X-User-Id': user.id },
          body: '{}'
        });
      } catch(e) {}
    }
    function sendOnline() {
      sendHeartbeat();
    }
    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        sendOffline();      // 页面隐藏 → 标记离线
      } else {
        sendOnline();       // 页面可见 → 恢复在线
      }
    });
    window.addEventListener('beforeunload', sendOffline);   // 关闭/刷新时离线
    window.addEventListener('pagehide', sendOffline);        // 移动端页面切换时离线

    // ============================================================
    // 全屏切换：点击全屏按钮进入/退出全屏模式
    // 双击页面空白处也可触发全屏切换
    // ============================================================
    document.getElementById('fullscreenToggle').addEventListener('click', function() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(function() {
          document.getElementById('fullscreenToggle').innerHTML = '<i class="fas fa-compress"></i> 退出全屏';
        }).catch(function() {});
      } else {
        document.exitFullscreen().then(function() {
          document.getElementById('fullscreenToggle').innerHTML = '<i class="fas fa-expand"></i> 全屏';
        }).catch(function() {});
      }
    });
    // 监听全屏状态变化，同步按钮文字
    document.addEventListener('fullscreenchange', function() {
      var btn = document.getElementById('fullscreenToggle');
      if (btn) btn.innerHTML = document.fullscreenElement
        ? '<i class="fas fa-compress"></i> 退出全屏'
        : '<i class="fas fa-expand"></i> 全屏';
    });
    // 双击页面空白处也可切换全屏（方便大屏触控操作）
    document.getElementById('displayContainer').addEventListener('dblclick', function() {
      document.getElementById('fullscreenToggle').click();
    });

    // ============================================================
    // 退出展示：确认后退出全屏并返回首页
    // ============================================================
    document.getElementById('exitDisplayBtn').addEventListener('click', function() {
      if (confirm('确定退出看板展示吗？')) {
        if (document.fullscreenElement) {
          document.exitFullscreen().catch(function() {});
        }
        window.location.href = 'index.html';
      }
    });

    // ============================================================
    // 窗口大小变化时重绘所有 ECharts 实例
    // ============================================================
    window.addEventListener('resize', function() {
      Object.values(chartInstances).forEach(function(chart) {
        if (chart && chart.resize) chart.resize();
      });
    });

    // ============================================================
    // DOM 初始化：加载看板展示数据
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      loadDisplay();
    });
  </script>
</body>
</html>

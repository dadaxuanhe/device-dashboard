<!DOCTYPE html>
<!-- ============================================================
     页面：设备详情页 (detail.html)
     用途：展示单个设备的详细信息，包括设备概览、实时运行参数、
           温度趋势图表、维修历史记录，以及同类型设备快速切换。
     所属项目：智能工厂设备监控看板
     ============================================================ -->
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设备详情 - 设备监控看板</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">

  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <style>
    /* ===== 普通员工（viewer）专属样式 ===== */
    body.is-viewer .viewer-hide { display: none !important; }  /* 隐藏管理类按钮 */
    body.is-viewer .fav-btn-detail { display: inline-flex !important; }       /* 收藏按钮仅员工可见 */
    .fav-btn-detail.favorited { border-color: #ffd740 !important; color: #ffd740 !important; background: rgba(255,215,0,0.12) !important; }  /* 已收藏状态 */
    .fav-btn-detail.favorited i { font-weight: 900; }
    .fav-btn-detail:hover { border-color: #ffd740; color: #ffd740; }  /* 悬停高亮 */

    .device-hero {  /* 设备概览英雄区：名称 + 状态标签水平排列 */
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 24px; background: var(--bg-card);
      border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 24px;
    }
    .device-hero .info { display: flex; flex-direction: column; gap: 4px; }
    .device-hero .name { font-size: 24px; font-weight: 600; color: var(--text-primary); }
    .device-hero .code { font-size: 14px; color: var(--text-secondary); }
    .device-hero .status-badge {
      display: flex; align-items: center; gap: 8px; padding: 8px 20px;
      border-radius: 20px; font-size: 16px; font-weight: 500;
    }
    .device-hero .status-badge .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .device-hero .status-badge.running { background: rgba(0,230,118,0.15); color: #00e676; }
    .device-hero .status-badge.running .dot { background: #00e676; }
    .device-hero .status-badge.idle { background: rgba(255,215,64,0.15); color: #ffd740; }
    .device-hero .status-badge.idle .dot { background: #ffd740; }
    .device-hero .status-badge.fault { background: rgba(255,23,68,0.15); color: #ff1744; }
    .device-hero .status-badge.fault .dot { background: #ff1744; }
    .device-hero .status-badge.offline { background: rgba(84,110,122,0.15); color: #546e7a; }
    .device-hero .status-badge.offline .dot { background: #546e7a; }

    .device-meta {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px; margin-bottom: 24px;
    }
    .device-meta .meta-item {
      padding: 12px 16px; background: var(--bg-card);
      border-radius: 8px; border: 1px solid var(--border-color);
    }
    .device-meta .meta-item .label { font-size: 12px; color: var(--text-secondary); }
    .device-meta .meta-item .value { font-size: 16px; font-weight: 500; color: var(--text-primary); margin-top: 2px; }

    .params-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px; margin-bottom: 24px;
    }
    .param-card {
      padding: 16px 20px; background: var(--bg-card);
      border: 1px solid var(--border-color); border-radius: 12px;
    }
    .param-card .param-name { font-size: 13px; color: var(--text-secondary); }
    .param-card .param-value { font-size: 28px; font-weight: 700; color: var(--text-primary); margin: 4px 0 8px 0; }
    .param-card .param-unit { font-size: 14px; font-weight: 400; color: var(--text-secondary); margin-left: 4px; }

    .param-bar { width: 100%; height: 6px; background: var(--bg-secondary); border-radius: 4px; overflow: hidden; }
    .param-bar .fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
    .param-bar .fill.normal { background: #00e676; }
    .param-bar .fill.warning { background: #ffd740; }
    .param-bar .fill.danger { background: #ff1744; }
    .param-threshold { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
    .param-status { font-size: 12px; margin-top: 4px; }
    .param-status.normal { color: #00e676; }
    .param-status.warning { color: #ffd740; }
    .param-status.danger { color: #ff1744; }

    .detail-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 24px; }
    .detail-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; }
    .detail-card .card-title { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 12px; }
    .detail-card .chart-container { width: 100%; height: 220px; }

    .maintenance-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .maintenance-table th { text-align: left; padding: 8px 10px; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); font-weight: 500; }
    .maintenance-table td { padding: 8px 10px; color: var(--text-primary); border-bottom: 1px solid rgba(42,58,92,0.3); }
    .maintenance-table tr:last-child td { border-bottom: none; }
    .maintenance-table .empty { text-align: center; color: var(--text-secondary); padding: 24px 0; }

    .back-btn {  /* 返回按钮 */
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
      background: transparent; border: 1px solid var(--border-color); border-radius: 6px;
      color: var(--text-secondary); cursor: pointer; transition: all 0.3s;
      font-size: 14px; margin-bottom: 16px;
    }
    .back-btn:hover { border-color: var(--color-primary); color: var(--text-primary); }

    .section-title { color: var(--text-primary); margin-bottom: 12px; font-size: 1.1rem; font-weight: 600; }

    /* ===== 同类型设备快速切换 ===== */
    .other-devices {
      margin-top: 24px;
      padding: 20px 24px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
    }
    .other-devices .section-title { margin-bottom: 16px; }
    .other-devices-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .other-device-card {
      display: block;
      padding: 14px 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-primary);
      transition: all 0.25s ease;
      background: var(--bg-secondary);
    }
    .other-device-card:hover {
      border-color: var(--color-primary);
      background: rgba(59,130,246,0.08);
    }
    .other-device-card .dev-name {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .other-device-card .dev-code {
      font-size: 12px;
      color: var(--text-secondary);
    }
    .other-device-card .dev-status {
      display: inline-block;
      margin-top: 6px;
      padding: 1px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
    }
    .other-device-card .dev-status.running { background: rgba(0,230,118,0.15); color: #00e676; }
    .other-device-card .dev-status.idle { background: rgba(255,215,64,0.15); color: #ffd740; }
    .other-device-card .dev-status.fault { background: rgba(255,23,68,0.15); color: #ff1744; }
    .other-device-card .dev-status.offline { background: rgba(84,110,122,0.15); color: #546e7a; }

    .params-grid { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    .health-card { background: linear-gradient(135deg, rgba(108,63,245,0.08), rgba(0,230,118,0.05)) !important; border-color: rgba(108,63,245,0.2) !important; }
    .health-score { font-size: 36px; font-weight: 700; color: var(--text-primary); margin: 4px 0 8px 0; }
    .health-score.normal { color: #00e676; }
    .health-score.warning { color: #ffd740; }
    .health-score.danger { color: #ff1744; }

    @media (max-width: 767px) {
      .device-hero { flex-direction: column; align-items: flex-start; gap: 12px; padding: 16px; }
      .device-hero .name { font-size: 20px; }
      .params-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .param-card .param-value { font-size: 22px; }
      .detail-grid { grid-template-columns: 1fr; }
      .detail-card .chart-container { height: 180px; }
      .device-meta { grid-template-columns: 1fr 1fr; }
      .user-info-desktop { display: none !important; }
    }
    @media (min-width: 768px) and (max-width: 1023px) {
      .params-grid { grid-template-columns: repeat(4, 1fr); }
      .detail-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (min-width: 768px) { .user-info-desktop { display: block !important; } }
  </style>
</head>
<body>
  <!-- ===== 加载进度条 ===== -->
  <div id="pageLoader" style="position:fixed;inset:0;z-index:99999;background:#0a0e17;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s ease;">
    <div style="width:280px;max-width:80%;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
        <div style="width:40px;height:40px;border:3px solid rgba(108,63,245,0.3);border-top-color:#6C3FF5;border-radius:50%;animation:loaderSpin 0.8s linear infinite;"></div>
        <div><div style="font-size:18px;font-weight:600;color:#e8edf5;">智能看板</div><div style="font-size:13px;color:#6a7588;margin-top:2px;">正在加载...</div></div>
      </div>
      <div style="height:4px;background:#1e293b;border-radius:4px;overflow:hidden;">
        <div id="loaderBar" style="height:100%;width:0%;background:linear-gradient(90deg,#6C3FF5,#8b5cf6);border-radius:4px;transition:width 0.4s ease;"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:#5a6478;margin-top:6px;">
        <span id="loaderStatus">初始化...</span>
        <span id="loaderPercent">0%</span>
      </div>
    </div>
  </div>
  <style>@keyframes loaderSpin{to{transform:rotate(360deg)}}#pageLoader.hide{opacity:0;pointer-events:none}</style>
  <script>
    (function(){var L=document.getElementById('pageLoader'),B=document.getElementById('loaderBar'),S=document.getElementById('loaderStatus'),P=document.getElementById('loaderPercent'),p=0;
    function setP(pct,msg){p=Math.min(pct,100);if(B)B.style.width=p+'%';if(P)P.textContent=p+'%';if(S&&msg)S.textContent=msg;}
    var steps={css:false,fonts:false,dom:false,api:false};
    function check(){if(steps.css&&steps.fonts&&steps.dom&&steps.api){setP(100,'加载完成');setTimeout(function(){L.classList.add('hide')},400);}}
    setP(5,'正在连接...');
    document.querySelectorAll('link[rel="stylesheet"]').forEach(function(l){if(l.sheet){steps.css=true;setP(25,'样式加载完成');check();return;}l.addEventListener('load',function(){steps.css=true;setP(25,'样式加载完成');check();});});
    if(document.readyState!=='loading'){steps.dom=true;setP(35,'页面结构就绪');check();}else document.addEventListener('DOMContentLoaded',function(){steps.dom=true;setP(35,'页面结构就绪');check();});
    if(document.fonts)document.fonts.ready.then(function(){steps.fonts=true;setP(45,'字体就绪');check();});else{steps.fonts=true;setP(45,'');check();}
    window.__loaderMarkApiReady=function(){steps.api=true;setP(80,'数据加载完成');check();};
    setTimeout(function(){if(L&&!L.classList.contains('hide')){setP(100,'加载完成');setTimeout(function(){L.classList.add('hide')},400);}},10000);})();
  </script>
  <!-- ============================================================
       侧边栏导航 - 页面顶部左侧固定导航栏，包含应用 Logo、
       功能模块菜单（总览/设备/告警/人员/设置）及主题切换按钮。
       ============================================================ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="../assets/icons/logo.svg" alt="Logo" class="sidebar-logo">
      <h1 class="sidebar-title">智能看板</h1>
      <button class="sidebar-toggle" id="sidebarToggle">
        <img src="../assets/icons/collapse.svg" alt="折叠">
      </button>
    </div>
    <nav class="sidebar-nav">
      <a href="../index.html" class="nav-item" data-page="dashboard">
        <img src="../assets/icons/dashboard.svg" class="nav-icon">
        <span class="nav-text">总览看板</span>
      </a>
      <a href="detail.html" class="nav-item active" data-page="detail">
        <img src="../assets/icons/device.svg" class="nav-icon">
        <span class="nav-text">设备管理</span>
      </a>
      <a href="alarms.html" class="nav-item" data-page="alarms">
        <img src="../assets/icons/alarm.svg" class="nav-icon">
        <span class="nav-text">告警管理</span>
        <span class="nav-badge" id="alarmBadge" style="display:none;">0</span>
      </a>
      <a href="personnel.html" class="nav-item" data-page="personnel">
        <img src="../assets/icons/user.svg" class="nav-icon">
        <span class="nav-text">人员管理</span>
      </a>
      <a href="templates.html" class="nav-item" data-page="templates">
        <img src="../assets/icons/template.svg" class="nav-icon">
        <span class="nav-text">看板模板</span>
      </a>
      <a href="publish.html" class="nav-item" data-page="publish">
        <img src="../assets/icons/publish.svg" class="nav-icon">
        <span class="nav-text">发布管理</span>
      </a>
      <a href="settings.html" class="nav-item" data-page="settings">
        <img src="../assets/icons/settings.svg" class="nav-icon">
        <span class="nav-text">系统设置</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon" id="themeIcon"></i>
        <span class="theme-label">暗色主题</span>
      </button>
    </div>
  </aside>

  <!-- ===== 侧边栏遮罩层（移动端点击关闭侧边栏） ===== -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ============================================================
       主内容区 - 页面主体部分，包含顶部导航栏 (topbar) 和页面内容区域。
       ============================================================ -->
  <main class="main-content" id="mainContent">
    <header class="topbar">
      <div class="topbar__left">
        <span class="topbar__hamburger" id="menuBtn"><i class="fas fa-bars"></i></span>
        <span class="topbar__breadcrumb">首页 / <span>设备详情</span></span>
      </div>
      <div class="topbar__right">
        <span class="topbar__clock" id="clock">--:--:--</span>
        <button class="topbar__icon-btn" id="topThemeBtn" title="切换主题"><i class="fas fa-moon"></i></button>
        <button class="topbar__icon-btn" id="refreshBtn" title="刷新数据"><i class="fas fa-sync-alt"></i></button>
        <div class="topbar__user" id="userAvatar" title="用户信息" style="display:flex;align-items:center;gap:6px;cursor:pointer;">
          <div style="width:32px;height:32px;border-radius:50%;background:var(--brand-purple,#6C3FF5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;">A</div>
          <div style="text-align:left;line-height:1.3;display:none;" class="user-info-desktop">
            <div id="userNameDisplay" style="font-size:13px;font-weight:600;color:var(--text-primary);">用户</div>
            <div id="userRoleDisplay" style="font-size:11px;color:var(--text-muted);">普通员工</div>
          </div>
        </div>
      </div>
    </header>

    <div class="content-area" style="padding:0;">
      <!-- ===== 页面操作按钮区：返回总览、添加设备、删除当前设备 ===== -->
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
        <button class="back-btn" onclick="location.href='../index.html'" style="margin-bottom:0;">← 返回总览</button>
        <button id="addDeviceBtn" class="viewer-hide" style="padding:8px 16px;font-size:13px;border-radius:8px;background:var(--brand-purple,#6C3FF5);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;gap:4px;"><i class="fas fa-plus"></i> 添加设备</button>
        <button id="deleteDeviceBtn" class="viewer-hide" style="padding:8px 16px;font-size:13px;border-radius:8px;background:rgba(244,67,54,0.15);color:#f44336;border:1px solid rgba(244,67,54,0.3);cursor:pointer;display:flex;align-items:center;gap:4px;display:none;"><i class="fas fa-trash"></i> 删除本设备</button>
        <!-- 普通员工收藏按钮 -->
        <button id="favBtnDetail" class="fav-btn-detail" style="display:none;padding:8px 16px;font-size:13px;border-radius:8px;background:transparent;border:1px solid var(--border-color);color:var(--text-secondary);cursor:pointer;align-items:center;gap:6px;"><i class="far fa-star"></i> 关注设备</button>
      </div>

      <!-- ===== 设备概览区域（英雄区）：显示设备名称、编号、型号、状态和 OEE 指标 ===== -->
      <div class="device-hero" id="deviceHero"></div>
      <!-- ===== 设备元信息：型号、制造商、所在位置、投产日期 ===== -->
      <div class="device-meta" id="deviceMeta"></div>

      <!-- ===== 实时运行参数区：以卡片网格展示温度、电流、电压、压力等关键指标及其阈值状态 ===== -->
      <h3 class="section-title">📊 实时参数</h3>
      <div class="params-grid" id="paramsGrid"></div>

      <!-- ===== 详情双栏布局：左侧温度趋势 ECharts 图表 / 右侧维修历史记录表格 ===== -->
      <div class="detail-grid">
        <div class="detail-card">
          <div class="card-title">🌡️ 温度趋势</div>
          <div id="detailTempChart" class="chart-container"></div>
        </div>
        <div class="detail-card">
          <div class="card-title">🔧 维修历史</div>
          <div id="maintenanceList"></div>
        </div>
      </div>

      <!-- ===== 同类型设备快速切换 ===== -->
      <div class="other-devices" id="otherDevicesSection" style="display:none;">
        <h3 class="section-title">📋 其他设备</h3>
        <div class="other-devices-grid" id="otherDevicesGrid"></div>
      </div>
    </div>
  </main>

  <!-- ============================================================
       页面级 JavaScript
       引入公共模块 (utils.js / api.js / app.js) 后，在此定义
       设备详情页特有的数据加载与渲染逻辑。
       ============================================================ -->
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/realtime.js"></script>
  <script src="../js/app.js"></script>
  <script>
    // ============================================================
    // 从 URL 参数中获取设备 ID，默认为 1
    // ============================================================
    var equipmentId = new URLSearchParams(window.location.search).get('id') || 1;
    var chartInstance = null;

    // ============================================================
    // 渲染温度趋势折线图（使用 ECharts）
    // 参数 data: [{ time: string, value: number }] 格式的时间序列数据
    // ============================================================
    function renderTrendChart(data) {
      var dom = document.getElementById('detailTempChart');
      if (!dom) return;
      if (!chartInstance) chartInstance = echarts.init(dom, 'dark');
      var option = {
        tooltip: { trigger: 'axis', position: function(point, params, dom, rect, size) { var x = point[0] - size.contentSize[0] / 2; x = Math.max(4, Math.min(x, size.viewSize[0] - size.contentSize[0] - 4)); return [x, -size.contentSize[1] - 8]; }, formatter: function(p) { return '<strong>' + p[0].axisValue + '</strong><br/>温度：' + p[0].value + '℃'; } },
        grid: { left: 70, right: 20, top: 20, bottom: 30 },
        xAxis: { type: 'category', data: data.map(function(d){return d.time;}), axisLine: {lineStyle:{color:'#2a3a5c'}}, axisLabel: {color:'#8899bb',fontSize:11} },
        yAxis: {
          type: 'value',
          name: '温度（℃）',
          nameLocation: 'middle',
          nameGap: 50,
          nameTextStyle: { color: '#8899bb', fontSize: 11 },
          splitLine: { lineStyle: { color: '#1a2335' } },
          axisLabel: { color: '#8899bb' }
        },
        series: [{ type: 'line', data: data.map(function(d){return d.value;}), smooth: true, symbol: 'circle', symbolSize: 6, lineStyle: {color:'#00bcd4',width:2}, areaStyle: { color: { type:'linear', x:0, y:0, x2:0, y2:1, colorStops:[{offset:0,color:'rgba(0,188,212,0.3)'},{offset:1,color:'rgba(0,188,212,0)'}] } } }]
      };
      chartInstance.setOption(option, true);
      chartInstance.resize();
    }

    // ============================================================
    // 渲染设备概览英雄区：名称、编号、型号、状态标签与 OEE 指标
    // ============================================================
    function renderDeviceHero(device) {
      var container = document.getElementById('deviceHero');
      var statusText = getStatusText(device.status);
      container.innerHTML =
        '<div class="info"><div class="name">' + device.name + '</div><div class="code">' + device.equipmentNo + ' | ' + device.type + ' | ' + device.model + '</div></div>' +
        '<div class="status-badge ' + device.status + '"><span class="dot"></span>' + statusText + ' · OEE ' + device.oee + '% · 今日产量 ' + device.currentOutput + '件</div>';
    }

    // ============================================================
    // 渲染设备元信息卡片：型号、制造商、位置、投产日期
    // ============================================================
    function renderDeviceMeta(device) {
      document.getElementById('deviceMeta').innerHTML =
        '<div class="meta-item"><div class="label">设备型号</div><div class="value">' + (device.model||'--') + '</div></div>' +
        '<div class="meta-item"><div class="label">制造商</div><div class="value">' + (device.manufacturer||'--') + '</div></div>' +
        '<div class="meta-item"><div class="label">所在位置</div><div class="value">' + (device.location||'--') + '</div></div>' +
        '<div class="meta-item"><div class="label">投产日期</div><div class="value">' + (device.installDate||'--') + '</div></div>' +
        '<div class="meta-item"><div class="label">维护周期</div><div class="value">' + (device.maintenance_cycle||'--') + ' 天</div></div>';
    }

    // ============================================================
    // 计算设备健康评分（基于四个参数的阈值偏离程度）
    // 返回 0-100 分，100 表示所有参数都在最佳范围
    // ============================================================
    function calcHealthScore(device) {
      var pArr = [
        { value: device.temperature, min: device.thresholds.temperature.min, max: device.thresholds.temperature.max },
        { value: device.current, min: device.thresholds.current.min, max: device.thresholds.current.max },
        { value: device.voltage, min: device.thresholds.voltage.min, max: device.thresholds.voltage.max },
        { value: device.pressure, min: device.thresholds.pressure.min, max: device.thresholds.pressure.max }
      ];
      var totalScore = 0;
      pArr.forEach(function(p) {
        var range = p.max - p.min;
        if (range <= 0) { totalScore += 100; return; }
        if (p.value < p.min || p.value > p.max) { totalScore += 40; return; }
        var mid = (p.min + p.max) / 2;
        var deviation = Math.abs(p.value - mid) / (range / 2);
        totalScore += Math.round(100 - deviation * 60);
      });
      return Math.round(totalScore / 4);
    }

    // ============================================================
    // 渲染实时运行参数卡片：温度/电流/电压/压力，含进度条与阈值状态
    // ============================================================
    function renderParams(device) {
      var params = [
        { key:'temperature', label:'温度', value:device.temperature, unit:'℃', min:device.thresholds.temperature.min, max:device.thresholds.temperature.max },
        { key:'current', label:'电流', value:device.current, unit:'A', min:device.thresholds.current.min, max:device.thresholds.current.max },
        { key:'voltage', label:'电压', value:device.voltage, unit:'V', min:device.thresholds.voltage.min, max:device.thresholds.voltage.max },
        { key:'pressure', label:'压力', value:device.pressure, unit:'MPa', min:device.thresholds.pressure.min, max:device.thresholds.pressure.max }
      ];
      var healthScore = calcHealthScore(device);
      var healthClass = healthScore >= 80 ? 'normal' : (healthScore >= 50 ? 'warning' : 'danger');
      var healthText = healthScore >= 80 ? '优秀' : (healthScore >= 50 ? '一般' : '较差');
      var healthCard = window.isOnlyViewer
        ? '<div class="param-card health-card"><div class="param-name">🏥 设备健康度</div>' +
          '<div class="health-score ' + healthClass + '">' + healthScore + '<span class="param-unit">分</span></div>' +
          '<div class="param-bar"><div class="fill ' + healthClass + '" style="width:' + healthScore + '%;"></div></div>' +
          '<div class="param-status ' + healthClass + '" style="margin-top:4px;">' + healthText + '</div></div>'
        : '';
      document.getElementById('paramsGrid').innerHTML = healthCard + params.map(function(p) {
        var range = p.max - p.min;
        var percent = Math.max(0, Math.min(100, ((p.value - p.min) / range) * 100));
        var status = 'normal', statusText = '正常';
        if (p.value < p.min || p.value > p.max) { status = 'danger'; statusText = '⚠️ 超阈值'; }
        else if (p.value < p.min + range * 0.1 || p.value > p.max - range * 0.1) { status = 'warning'; statusText = '⚠️ 接近阈值'; }
        return '<div class="param-card"><div class="param-name">' + p.label + '</div><div class="param-value">' + p.value + '<span class="param-unit">' + p.unit + '</span></div>' +
          '<div class="param-bar"><div class="fill ' + status + '" style="width:' + percent + '%;"></div></div>' +
          '<div class="param-threshold"><span>' + p.min + p.unit + '</span><span>' + p.max + p.unit + '</span></div>' +
          '<div class="param-status ' + status + '">' + statusText + '</div></div>';
      }).join('');
    }

    // ============================================================
    // 渲染维修历史表格
    // 参数 history: [{ date, faultDesc, measure, handler, hours }] 数组
    // ============================================================
    function renderMaintenance(history) {
      var container = document.getElementById('maintenanceList');
      if (!history || history.length === 0) {
        container.innerHTML = '<table class="maintenance-table"><tbody><tr><td class="empty">✅ 暂无维修记录</td></tr></tbody></table>';
        return;
      }
      container.innerHTML = '<table class="maintenance-table"><thead><tr><th>日期</th><th>故障描述</th><th>维修措施</th><th>维修人</th><th>耗时(h)</th></tr></thead><tbody>' +
        history.map(function(item) { return '<tr><td>' + item.date + '</td><td>' + item.faultDesc + '</td><td>' + item.measure + '</td><td>' + item.handler + '</td><td>' + item.hours + '</td></tr>'; }).join('') +
        '</tbody></table>';
    }

    // ============================================================
    // 主加载函数：获取设备详情、渲染页面内容、加载温度趋势数据
    // 并在完成后标记 API 数据就绪（关闭加载进度条）
    // ============================================================
    async function loadDetail() {
      try {
        var device = await getEquipmentDetail(parseInt(equipmentId));
        renderDeviceHero(device);
        renderDeviceMeta(device);
        renderParams(device);
        renderMaintenance(device.maintenanceHistory);

        var tempData = await getEquipmentTemperature(parseInt(equipmentId), { range: '7d' });
        _chartData = (tempData || []).slice(); // 保存副本供 SSE 追加
        renderTrendChart(_chartData);
      // 加载其他设备列表（排除当前设备）
      try {
        var allDevices = await getEquipment();
        renderOtherDevices(allDevices, parseInt(equipmentId));
      } catch (e) {
        console.error('加载其他设备列表失败:', e);
      }
      } catch (error) {
        console.error('加载设备详情失败:', error);
        document.getElementById('deviceHero').innerHTML = '<div class="info"><div class="name" style="color:#ff1744;">❌ 加载失败</div><div class="code">' + error.message + '</div></div>';
      }
      // 数据加载完成后显示删除按钮（普通员工不可见）
      if (!isOnlyViewer()) {
        document.getElementById('deleteDeviceBtn').style.display = 'flex';
      }
      // 普通员工：加载收藏状态
      if (typeof isOnlyViewer === 'function' && isOnlyViewer()) {
        initDetailFavorite(parseInt(equipmentId));
      }
      if (typeof window.__loaderMarkApiReady === 'function') window.__loaderMarkApiReady();
    }

    /** 当前设备是否已收藏 */
    var currentFavState = false;

    /**
     * 初始化详情页收藏按钮
     */
    async function initDetailFavorite(equipId) {
      try {
        var ids = await getFavorites();
        currentFavState = (ids || []).indexOf(equipId) !== -1;
      } catch (e) {
        console.warn('加载收藏状态失败:', e);
      }
      var btn = document.getElementById('favBtnDetail');
      if (btn) {
        btn.style.display = 'inline-flex';
        updateFavBtn(btn);
        btn.addEventListener('click', async function() {
          try {
            var result = await toggleFavorite(equipId);
            currentFavState = result.favorited;
            updateFavBtn(btn);
            if (typeof showToast === 'function') {
              showToast(currentFavState ? '⭐ 已关注该设备' : '已取消关注');
            }
          } catch (e) {
            console.error('切换收藏失败:', e);
            if (typeof showToast === 'function') showToast('❌ 操作失败');
          }
        });
      }
    }

    /** 更新收藏按钮样式 */
    function updateFavBtn(btn) {
      if (currentFavState) {
        btn.classList.add('favorited');
        btn.innerHTML = '<i class="fas fa-star"></i> 已关注';
      } else {
        btn.classList.remove('favorited');
        btn.innerHTML = '<i class="far fa-star"></i> 关注设备';
      }
    }

    // ============================================================
    // 渲染「其他设备」快捷切换区域：过滤掉当前查看的设备，
    // 最多显示 15 台同类型设备，点击可快速跳转详情页。
    // ============================================================
    function renderOtherDevices(list, currentId) {
      var container = document.getElementById('otherDevicesSection');
      var grid = document.getElementById('otherDevicesGrid');

      // 1. 过滤：移除当前正在查看的设备
      var filteredList = (list || []).filter(function(dev) {
        return dev.id !== currentId;
      });

      if (filteredList.length === 0) {
        container.style.display = 'none';
        return;
      }

      // 2. 限制最多显示 15 台，防止页面过长
      var displayList = filteredList.slice(0, 15);

      container.style.display = 'block';
      grid.innerHTML = displayList.map(function(dev) {
        var statusText = getStatusText ? getStatusText(dev.status) : dev.status;
        return '<a class="other-device-card" href="detail.html?id=' + dev.id + '">' +
          '<div class="dev-name">' + (dev.name || '--') + '</div>' +
          '<div class="dev-code">' + (dev.equipmentNo || dev.code || '') + '</div>' +
          '<span class="dev-status ' + (dev.status || '') + '">' + statusText + '</span>' +
          '</a>';
      }).join('');
    }

    // ============================================================
    // 添加 / 删除设备：打开添加设备弹窗、关闭弹窗重置表单、
    // 提交新设备数据到后端、删除当前设备并返回总览页。
    // ============================================================
    function openAddDevice() {
      document.getElementById('addDeviceModal').style.display = 'flex';
      // 自动获取并填充下一个设备编号
      if (typeof getNextEquipmentNo === 'function') {
        getNextEquipmentNo().then(function(result) {
          if (result && result.nextNo) {
            document.getElementById('de_no').value = result.nextNo;
          }
          document.getElementById('de_no').focus();
        }).catch(function() {
          document.getElementById('de_no').focus();
        });
      } else {
        document.getElementById('de_no').focus();
      }
      var today = new Date().toISOString().split('T')[0];
      document.getElementById('de_date').value = today;
    }
    function closeAddDevice() {
      document.getElementById('addDeviceModal').style.display = 'none';
      ['de_no','de_name','de_model','de_mfr','de_loc','de_date'].forEach(function(id) { document.getElementById(id).value = ''; });
    }
    async function submitAddDevice() {
      var no = document.getElementById('de_no').value.trim();
      var name = document.getElementById('de_name').value.trim();
      var type = document.getElementById('de_type').value;
      var model = document.getElementById('de_model').value.trim();
      var mfr = document.getElementById('de_mfr').value.trim();
      var loc = document.getElementById('de_loc').value.trim();
      var date = document.getElementById('de_date').value;
      var status = document.getElementById('de_status').value;
      if (!no) { alert('请输入设备编号'); return; }
      if (!name) { alert('请输入设备名称'); return; }
      var btn = document.getElementById('confirmAddDevice');
      btn.textContent = '添加中...'; btn.disabled = true;
      try {
        var r = await addEquipment({ equipmentNo:no, name:name, type:type, model:model, manufacturer:mfr, location:loc, installDate:date, status:status });
        if (r && r.success !== false) {
          closeAddDevice();
          if (typeof showToast === 'function') showToast('✅ 设备 "' + name + '" 添加成功');
        } else {
          alert('添加失败：' + (r && r.message || '未知错误'));
        }
      } catch (e) { alert('添加失败：' + e.message); }
      finally { btn.textContent = '确认添加'; btn.disabled = false; }
    }
    async function deleteCurrentDevice() {
      var hero = document.getElementById('deviceHero');
      var name = hero ? hero.querySelector('.name')?.textContent || '本设备' : '本设备';
      if (!confirm('确定要删除 "' + name + '" 吗？此操作不可恢复！')) return;
      try {
        await deleteEquipment(parseInt(equipmentId));
        if (typeof showToast === 'function') showToast('✅ 设备已删除');
        setTimeout(function() { location.href = '../index.html'; }, 800);
      } catch (e) { alert('删除失败：' + e.message); }
    }

    // ============================================================
    // DOM 初始化：时钟、主题切换、加载设备详情、绑定按钮事件、
    // 每 60 秒自动刷新，窗口缩放时自适应图表尺寸。
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      // 普通员工标记（CSS控制显示/隐藏）
      if (typeof isOnlyViewer === 'function' && isOnlyViewer()) {
        document.body.classList.add('is-viewer');
      }
      initClock();
      if (typeof initThemeToggle === 'function') initThemeToggle();
      loadDetail();
      document.getElementById('addDeviceBtn').addEventListener('click', openAddDevice);
      document.getElementById('deleteDeviceBtn').addEventListener('click', deleteCurrentDevice);
      var sysInterval = parseInt(localStorage.getItem('dashboard_refreshInterval')) || 60000;
      setInterval(loadDetail, sysInterval);

      // ============================================================
      // SSE 实时数据 — 详情页参数更新
      // ============================================================
      if (typeof connectSSE === 'function') {
        connectSSE();
      }
    });

    /**
     * 当前设备数据快照 —— 供 SSE 增量更新参考（预留扩展）
     * 当收到 device-param-update 事件时，可从快照中获取旧值做对比
     */
    var _currentDeviceData = null;

    /**
     * 温度趋势图当前数据缓存
     * 初始由 loadDetail() 从后端获取历史数据填充，
     * SSE device-param-update 事件收到温度更新时追加新点，
     * 保持最多 60 个数据点，超出时自动移除最早的点。
     * @type {Array<{time: string, value: number}>}
     */
    var _chartData = [];

    /**
     * SSE: 设备参数实时更新
     */
    if (typeof onSSE === 'function') {
      onSSE('device-param-update', function(data) {
        if (!data.devices || data.devices.length === 0) return;
        var currentId = parseInt(equipmentId);
        var match = data.devices.find(function(d) { return d.id === currentId; });
        if (!match || !match.params) return;

        // 更新参数卡片中的数值
        var grid = document.getElementById('paramsGrid');
        if (!grid) return;

        var paramCards = grid.querySelectorAll('.param-card');
        if (!paramCards || paramCards.length === 0) return;

        var chartUpdated = false;
        var paramKeys = Object.keys(match.params);

        // ---- 温度趋势图实时追加 ----
        // 当 SSE 推送的温度值到达时，以当前时间 HH:mm:ss 为标签，
        // 追加一个数据点到 _chartData 缓存，然后刷新 ECharts 图表。
        // 限制最多 60 个点，超出的自动移除最早数据，防止图表过密。
        if (match.params.temperature !== undefined) {
          var now = new Date();
          var timeStr = String(now.getHours()).padStart(2,'0') + ':' +
                        String(now.getMinutes()).padStart(2,'0') + ':' +
                        String(now.getSeconds()).padStart(2,'0');
          _chartData.push({ time: timeStr, value: match.params.temperature });
          // 保持最近 60 个数据点，防止过多
          if (_chartData.length > 60) _chartData = _chartData.slice(-60);
          chartUpdated = true;
        }

        paramKeys.forEach(function(key) {
          var newValue = match.params[key];
          if (newValue === undefined) return;

          // 找到对应的参数卡片（跳过健康度卡片）
          var labelMap = { temperature:'温度', current:'电流', voltage:'电压', pressure:'压力' };
          var label = labelMap[key];
          if (!label) return;

          for (var i = 0; i < paramCards.length; i++) {
            var nameEl = paramCards[i].querySelector('.param-name');
            if (nameEl && nameEl.textContent.trim() === label) {
              // 更新数值
              var valueEl = paramCards[i].querySelector('.param-value');
              if (valueEl) {
                var unit = valueEl.querySelector('.param-unit');
                var unitText = unit ? unit.textContent : '';
                valueEl.childNodes[0].textContent = newValue;
              }
              // 更新进度条
              var fillEl = paramCards[i].querySelector('.param-bar .fill');
              var thresholdEls = paramCards[i].querySelectorAll('.param-threshold span');
              if (fillEl && thresholdEls.length >= 2) {
                var pMin = parseFloat(thresholdEls[0].textContent);
                var pMax = parseFloat(thresholdEls[1].textContent);
                if (!isNaN(pMin) && !isNaN(pMax) && pMax > pMin) {
                  var pct = Math.max(0, Math.min(100, ((newValue - pMin) / (pMax - pMin)) * 100));
                  fillEl.style.width = pct + '%';
                  // 更新状态
                  var statusEl = paramCards[i].querySelector('.param-status');
                  if (statusEl) {
                    var newStatus = 'normal';
                    var newStatusText = '正常';
                    var range = pMax - pMin;
                    if (newValue < pMin || newValue > pMax) {
                      newStatus = 'danger';
                      newStatusText = '⚠️ 超阈值';
                    } else if (newValue < pMin + range * 0.1 || newValue > pMax - range * 0.1) {
                      newStatus = 'warning';
                      newStatusText = '⚠️ 接近阈值';
                    }
                    statusEl.className = 'param-status ' + newStatus;
                    statusEl.textContent = newStatusText;
                    fillEl.className = 'fill ' + newStatus;
                  }
                }
              }
              break;
            }
          }
        });

        // ---- 刷新 ECharts 趋势图 ----
        // 如果温度数据有更新（chartUpdated=true），则调用
        // chartInstance.setOption() 增量更新图表的 X 轴标签和序列数据，
        // 保持动画和已有样式不变（第二个参数不传 true 即合并更新）。
        // 若图表实例尚未初始化则回退调用完整渲染函数。
        if (chartUpdated && _chartData.length > 0) {
          if (chartInstance) {
            chartInstance.setOption({
              xAxis: { data: _chartData.map(function(d) { return d.time; }) },
              series: [{ data: _chartData.map(function(d) { return d.value; }) }]
            });
          } else {
            if (typeof renderTrendChart === 'function') {
              renderTrendChart(_chartData);
            }
          }
        }
      });

      // 设备状态变更
      onSSE('device-status-change', function(data) {
        var currentId = parseInt(equipmentId);
        if (data.id !== currentId) return;
        // 状态变化时重新加载详情页以更新所有 UI
        loadDetail();
      });
    }

    window.addEventListener('resize', function() { if (chartInstance) chartInstance.resize(); });
  </script>

        <div><label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px;">制造商</label><input id="de_mfr" placeholder="如 DMG MORI" style="width:100%;padding:10px 14px;background:var(--bg-secondary,#0f172a);border:1px solid var(--border-color,#1e293b);border-radius:8px;color:var(--text-primary,#e8edf5);font-size:14px;outline:none;box-sizing:border-box;"></div>
        <div><label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px;">安装位置</label><input id="de_loc" placeholder="如 一车间-A区" style="width:100%;padding:10px 14px;background:var(--bg-secondary,#0f172a);border:1px solid var(--border-color,#1e293b);border-radius:8px;color:var(--text-primary,#e8edf5);font-size:14px;outline:none;box-sizing:border-box;"></div>
        <div><label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px;">安装日期</label><input id="de_date" type="date" style="width:100%;padding:10px 14px;background:var(--bg-secondary,#0f172a);border:1px solid var(--border-color,#1e293b);border-radius:8px;color:var(--text-primary,#e8edf5);font-size:14px;outline:none;box-sizing:border-box;color-scheme:dark;"></div>
        <div><label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px;">初始状态</label>
          <select id="de_status" style="width:100%;padding:10px 14px;background:var(--bg-secondary,#0f172a);border:1px solid var(--border-color,#1e293b);border-radius:8px;color:var(--text-primary,#e8edf5);font-size:14px;outline:none;box-sizing:border-box;">
            <option value="online">运行中</option><option value="warning">待机</option><option value="error">故障</option><option value="offline">离线</option>
          </select></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:20px;">
        <button onclick="closeAddDevice()" style="flex:1;padding:10px;border:1px solid var(--border-color,#1e293b);border-radius:8px;background:transparent;color:var(--text-secondary,#8899bb);cursor:pointer;font-size:14px;">取消</button>
        <button id="confirmAddDevice" onclick="submitAddDevice()" style="flex:1;padding:10px;border:none;border-radius:8px;background:#6C3FF5;color:#fff;cursor:pointer;font-size:14px;font-weight:600;">确认添加</button>
      </div>
    </div>
  </div>

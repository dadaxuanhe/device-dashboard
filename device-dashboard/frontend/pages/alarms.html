<!DOCTYPE html>
<!-- ============================================================
     页面：告警管理页 (alarms.html)
     用途：集中展示和处置所有设备告警，支持按级别/状态/设备
           筛选、确认/清除告警、导出 CSV，并带有分页功能。
     所属项目：智能工厂设备监控看板
     ============================================================ -->
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>告警管理 - 设备监控看板</title>

  <!-- CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

  <style>
    /* ============================================================
       告警页面专属样式
       ============================================================ */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .page-title {
      font-size: 24px; font-weight: 600; color: var(--text-primary);
    }
    .page-title .badge {
      font-size: 14px; font-weight: 400; color: var(--text-secondary); margin-left: 12px;
    }
    .alarm-summary {
      display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .summary-item {
      display: flex; align-items: center; gap: 8px; padding: 8px 16px;
      background: var(--bg-card); border-radius: 8px; border-left: 4px solid var(--border-color);
    }
    .summary-item .count { font-size: 20px; font-weight: 700; }
    .summary-item .label { font-size: 13px; color: var(--text-secondary); }
    .summary-item.critical { border-left-color: #ff1744; }
    .summary-item.critical .count { color: #ff1744; }
    .summary-item.major { border-left-color: #ff9100; }
    .summary-item.major .count { color: #ff9100; }
    .summary-item.minor { border-left-color: #ffd740; }
    .summary-item.minor .count { color: #ffd740; }
    .summary-item.total { border-left-color: var(--color-primary); }
    .summary-item.total .count { color: var(--color-primary); }

    .alarm-filter-bar {
      display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center;
    }
    .alarm-filter-bar select, .alarm-filter-bar input {
      padding: 8px 12px; background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 6px; color: var(--text-primary); font-size: 14px;
    }
    .alarm-filter-bar select:focus, .alarm-filter-bar input:focus {
      border-color: var(--color-primary); outline: none;
    }
    .filter-label { font-size: 13px; color: var(--text-secondary); }

    .alarm-table-wrap {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 12px; overflow: hidden;
    }
    .alarm-table { width: 100%; border-collapse: collapse; }
    .alarm-table th {
      padding: 14px 16px; text-align: left; font-size: 13px; font-weight: 600;
      color: var(--text-secondary); border-bottom: 1px solid var(--border-color);
      background: rgba(0,0,0,0.2);
    }
    .alarm-table td {
      padding: 12px 16px; font-size: 14px; color: var(--text-primary);
      border-bottom: 1px solid rgba(42,58,92,0.3); vertical-align: middle;
    }
    .alarm-table tr:hover td { background: rgba(59,130,246,0.05); }
    .alarm-table tr:last-child td { border-bottom: none; }

    .level-tag {
      display: inline-block; padding: 2px 10px; border-radius: 12px;
      font-size: 12px; font-weight: 500;
    }
    .level-tag.critical { background: rgba(255,23,68,0.2); color: #ff1744; }
    .level-tag.major { background: rgba(255,145,0,0.2); color: #ff9100; }
    .level-tag.minor { background: rgba(255,215,64,0.2); color: #ffd740; }

    .status-tag {
      display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px;
    }
    .status-tag.active { background: rgba(255,23,68,0.15); color: #ff1744; }
    .status-tag.confirmed { background: rgba(255,215,64,0.15); color: #ffd740; }
    .status-tag.cleared { background: rgba(0,230,118,0.15); color: #00e676; }

    .action-btn {
      padding: 4px 14px; border: none; border-radius: 4px; font-size: 12px;
      cursor: pointer; transition: all 0.3s;
    }
    .action-btn.confirm { background: rgba(59,130,246,0.2); color: var(--color-primary); }
    .action-btn.confirm:hover { background: var(--color-primary); color: #fff; }
    .action-btn.clear { background: rgba(0,230,118,0.2); color: #00e676; }
    .action-btn.clear:hover { background: #00e676; color: #fff; }
    .action-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }

    @media (max-width: 767px) {
      .page-header { flex-direction: column; align-items: flex-start; gap: 12px; }
      .alarm-summary { gap: 8px; }
      .summary-item { padding: 6px 12px; }
      .summary-item .count { font-size: 16px; }
      .alarm-table-wrap { overflow-x: auto; }
      .alarm-table { font-size: 13px; min-width: 600px; }
      .alarm-table th, .alarm-table td { padding: 8px 12px; }
      .alarm-filter-bar { flex-direction: column; align-items: stretch; }
      .user-info-desktop { display: none !important; }
    }
    @media (min-width: 768px) {
      .user-info-desktop { display: block !important; }
    }

    /* ===== 分页 ===== */
    .page-btn:hover { border-color: var(--color-primary); color: var(--text-primary); }
    .page-btn:disabled { opacity:0.4; cursor:default; }

    /* ===== 统计面板 ===== */
    .stats-panel { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:20px; }
    .stats-card { background:var(--bg-card); border:1px solid var(--border-color); border-radius:8px; padding:14px; }
    .stats-card .stats-title { font-size:12px; color:var(--text-secondary); margin-bottom:8px; display:flex; align-items:center; gap:6px; }
    .stats-card .chart-container { height:160px; }
    .stats-card.tall { grid-column:span 1; }
    .stats-card.full { grid-column:1/-1; }
    .stats-card .chart-container-sm { height:120px; }
    @media (max-width:767px) { .stats-panel { grid-template-columns:1fr; } .stats-panel .stats-card:nth-child(-n+2) { display:none; } }

    /* ===== 紧急弹窗 ===== */
    .modal-overlay {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6);
      z-index:9999; align-items:center; justify-content:center;
    }
    .modal-overlay.show { display:flex; }
    .modal-box {
      background:var(--bg-card); border:1px solid var(--border-color);
      border-radius:12px; padding:24px; max-width:420px; width:90%;
      box-shadow:0 20px 60px rgba(0,0,0,0.5);
    }
    .modal-box h3 { margin-bottom:12px; font-size:18px; }
    .modal-box .modal-body { color:var(--text-secondary); font-size:14px; margin-bottom:18px; line-height:1.6; }
    .modal-box .modal-btn {
      padding:8px 24px; background:var(--color-danger); color:#fff;
      border:none; border-radius:8px; font-size:14px; cursor:pointer;
    }

    /* ===== 维修记录弹窗 ===== */
    .maintenance-btn {
      padding:4px 10px; border:none; border-radius:4px; font-size:11px;
      background:rgba(108,63,245,0.2); color:#6C3FF5; cursor:pointer;
      margin-left:4px; transition:all 0.2s;
    }
    .maintenance-btn:hover { background:#6C3FF5; color:#fff; }
    .maint-form-group { margin-bottom:12px; }
    .maint-form-group label { display:block; font-size:12px; font-weight:500; color:var(--text-secondary); margin-bottom:4px; }
    .maint-form-group input, .maint-form-group select, .maint-form-group textarea {
      width:100%; padding:8px 12px; background:var(--bg-secondary,#0f172a);
      border:1px solid var(--border-color,#1e293b); border-radius:6px;
      color:var(--text-primary,#e8edf5); font-size:13px; outline:none;
    }
    .maint-form-group textarea { min-height:60px; resize:vertical; }
    .maint-form-group input:focus, .maint-form-group select:focus, .maint-form-group textarea:focus {
      border-color:#6C3FF5;
    }
    .maint-form-row { display:flex; gap:10px; }
    .maint-form-row .maint-form-group { flex:1; }
    .maint-history { margin-top:12px; max-height:200px; overflow-y:auto; }
    .maint-history-item { padding:8px 12px; border:1px solid var(--border-color,#1e293b); border-radius:6px; margin-bottom:6px; font-size:12px; color:var(--text-secondary); }
        /* ============================================================
       【必须修复】强制侧边栏折叠样式（保证点击后视觉收缩）
       ============================================================ */
    /* 1. 折叠时，强制定位宽度为 64px */
    .sidebar.collapsed {
      width: 64px !important;
      transition: width 0.25s ease !important;
    }
    
    /* 2. 折叠时，强制隐藏侧边栏里的文字（解决文字挤出界面的问题） */
    .sidebar.collapsed .sidebar-title,
    .sidebar.collapsed .nav-text,
    .sidebar.collapsed .nav-badge,
    .sidebar.collapsed .theme-label {
      opacity: 0 !important;
      width: 0 !important;
      overflow: hidden !important;
      display: none !important;
    }

    /* 3. 折叠时，让导航图标在 64px 宽度中居中 */
    .sidebar.collapsed .nav-icon {
      margin: 0 auto !important;
    }
  </style>
</head>
<body>
  <!-- ===== 加载进度条 ===== -->
  <div id="pageLoader" style="position:fixed;inset:0;z-index:99999;background:#0a0e17;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s ease;">
    <div style="width:280px;max-width:80%;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
        <div style="width:40px;height:40px;border:3px solid rgba(108,63,245,0.3);border-top-color:#6C3FF5;border-radius:50%;animation:loaderSpin 0.8s linear infinite;"></div>
        <div><div style="font-size:18px;font-weight:600;color:#e8edf5;">智能看板</div><div style="font-size:13px;color:#6a7588;margin-top:2px;">正在加载...</div></div>
      </div>
      <div style="height:4px;background:#1e293b;border-radius:4px;overflow:hidden;">
        <div id="loaderBar" style="height:100%;width:0%;background:linear-gradient(90deg,#6C3FF5,#8b5cf6);border-radius:4px;transition:width 0.4s ease;"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:#5a6478;margin-top:6px;">
        <span id="loaderStatus">初始化...</span>
        <span id="loaderPercent">0%</span>
      </div>
    </div>
  </div>
  <style>@keyframes loaderSpin{to{transform:rotate(360deg)}}#pageLoader.hide{opacity:0;pointer-events:none}</style>
  <script>
    (function(){var L=document.getElementById('pageLoader'),B=document.getElementById('loaderBar'),S=document.getElementById('loaderStatus'),P=document.getElementById('loaderPercent'),p=0;
    function setP(pct,msg){p=Math.min(pct,100);if(B)B.style.width=p+'%';if(P)P.textContent=p+'%';if(S&&msg)S.textContent=msg;}
    var steps={css:false,fonts:false,dom:false,api:false};
    function check(){if(steps.css&&steps.fonts&&steps.dom&&steps.api){setP(100,'加载完成');setTimeout(function(){L.classList.add('hide')},400);}}
    setP(5,'正在连接...');
    document.querySelectorAll('link[rel="stylesheet"]').forEach(function(l){if(l.sheet){steps.css=true;setP(25,'样式加载完成');check();return;}l.addEventListener('load',function(){steps.css=true;setP(25,'样式加载完成');check();});});
    if(document.readyState!=='loading'){steps.dom=true;setP(35,'页面结构就绪');check();}else document.addEventListener('DOMContentLoaded',function(){steps.dom=true;setP(35,'页面结构就绪');check();});
    if(document.fonts)document.fonts.ready.then(function(){steps.fonts=true;setP(45,'字体就绪');check();});else{steps.fonts=true;setP(45,'');check();}
    window.__loaderMarkApiReady=function(){steps.api=true;setP(80,'数据加载完成');check();};
    setTimeout(function(){if(L&&!L.classList.contains('hide')){setP(100,'加载完成');setTimeout(function(){L.classList.add('hide')},400);}},10000);})();
  </script>
  <!-- ============================================================
       侧边栏导航 - 页面顶部左侧固定导航栏，包含应用 Logo、
       功能模块菜单（总览/设备/告警/人员/设置）及主题切换按钮。
       ============================================================ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="../assets/icons/logo.svg" alt="Logo" class="sidebar-logo">
      <h1 class="sidebar-title">智能看板</h1>
      <button class="sidebar-toggle" id="sidebarToggle">
        <img src="../assets/icons/collapse.svg" alt="折叠">
      </button>
    </div>
    <nav class="sidebar-nav">
      <a href="../index.html" class="nav-item" data-page="dashboard">
        <img src="../assets/icons/dashboard.svg" class="nav-icon">
        <span class="nav-text">总览看板</span>
      </a>
      <a href="detail.html" class="nav-item" data-page="detail">
        <img src="../assets/icons/device.svg" class="nav-icon">
        <span class="nav-text">设备管理</span>
      </a>
      <a href="alarms.html" class="nav-item active" data-page="alarms">
        <img src="../assets/icons/alarm.svg" class="nav-icon">
        <span class="nav-text">告警管理</span>
        <span class="nav-badge" id="alarmBadge" style="display:none;">0</span>
      </a>
      <a href="personnel.html" class="nav-item" data-page="personnel">
        <img src="../assets/icons/user.svg" class="nav-icon">
        <span class="nav-text">人员管理</span>
      </a>
      <a href="templates.html" class="nav-item" data-page="templates">
        <img src="../assets/icons/template.svg" class="nav-icon">
        <span class="nav-text">看板模板</span>
      </a>
      <a href="publish.html" class="nav-item" data-page="publish">
        <img src="../assets/icons/publish.svg" class="nav-icon">
        <span class="nav-text">发布管理</span>
      </a>
      <a href="settings.html" class="nav-item" data-page="settings">
        <img src="../assets/icons/settings.svg" class="nav-icon">
        <span class="nav-text">系统设置</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon" id="themeIcon"></i>
        <span class="theme-label">暗色主题</span>
      </button>
    </div>
  </aside>

  <!-- ===== 侧边栏遮罩层（移动端点击关闭侧边栏） ===== -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ============================================================
       主内容区 - 包含顶部导航栏 (topbar) 和告警管理内容区域。
       ============================================================ -->
  <main class="main-content" id="mainContent">
    <header class="topbar">
      <div class="topbar__left">
        <span class="topbar__hamburger" id="menuBtn"><i class="fas fa-bars"></i></span>
        <span class="topbar__breadcrumb">首页 / <span>告警管理</span></span>
      </div>
      <div class="topbar__right">
        <span class="topbar__clock" id="clock">--:--:--</span>
        <button class="topbar__icon-btn" id="topThemeBtn" title="切换主题"><i class="fas fa-moon"></i></button>
        <button class="topbar__icon-btn" id="refreshBtn" title="刷新数据"><i class="fas fa-sync-alt"></i></button>
        <!-- 用户信息 -->
        <div class="topbar__user" id="userAvatar" title="用户信息" style="display:flex;align-items:center;gap:6px;cursor:pointer;">
          <div style="width:32px;height:32px;border-radius:50%;background:var(--brand-purple,#6C3FF5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;">A</div>
          <div style="text-align:left;line-height:1.3;display:none;" class="user-info-desktop">
            <div id="userNameDisplay" style="font-size:13px;font-weight:600;color:var(--text-primary);">用户</div>
            <div id="userRoleDisplay" style="font-size:11px;color:var(--text-muted);">普通员工</div>
          </div>
        </div>
      </div>
    </header>

    <div class="content-area" style="padding:0;">
      <!-- ===== 页面标题区：告警管理标题 + 总告警数 + 导出/刷新按钮 ===== -->
      <div class="page-header">
        <h1 class="page-title">
          🔔 告警管理
          <span class="badge" id="totalBadge">共 0 条</span>
        </h1>
        <div style="display:flex;gap:8px;">
          <button class="btn btn--primary" id="exportBtn">📥 导出CSV</button>
          <button class="btn btn--primary" id="refreshAlarmsBtn">🔄 刷新</button>
        </div>
      </div>

      <!-- ===== 告警统计摘要区：紧急/重要/一般/总计 四种分类的告警数量统计卡片 ===== -->
      <div class="alarm-summary" id="alarmSummary">
        <!-- 由 JavaScript 动态渲染 -->
      </div>

      <!-- 统计图表面板 -->
      <div class="stats-panel" id="statsPanel" style="display:none;">
        <div class="stats-card">
          <div class="stats-title"><i class="fas fa-chart-pie"></i> 按级别分布</div>
          <div class="chart-container" id="levelChart"></div>
        </div>
        <div class="stats-card">
          <div class="stats-title"><i class="fas fa-chart-bar"></i> 按设备统计 (前5)</div>
          <div class="chart-container" id="deviceChart"></div>
        </div>
        <div class="stats-card">
          <div class="stats-title"><i class="fas fa-chart-line"></i> 告警趋势 <span id="statsRangeLabel" style="font-size:11px;color:var(--text-secondary);">近30天</span></div>
          <div class="chart-container" id="trendChart"></div>
        </div>
      </div>

      <!-- ===== 筛选栏：按告警级别、处理状态、所属设备进行筛选 ===== -->
      <div class="alarm-filter-bar">
        <span class="filter-label">级别：</span>
        <select id="levelFilter">
          <option value="all">全部</option>
          <option value="critical">紧急</option>
          <option value="warning">重要</option>
          <option value="info">一般</option>
        </select>

        <span class="filter-label">状态：</span>
        <select id="statusFilter">
          <option value="all">全部</option>
          <option value="active">未处理</option>
          <option value="confirmed">已确认</option>
          <option value="cleared">已清除</option>
        </select>

        <span class="filter-label">设备：</span>
        <select id="equipmentFilter">
          <option value="all">全部设备</option>
        </select>
      </div>

      <!-- ===== 告警列表表格：展示级别、设备名称、告警内容、时间、状态及操作按钮 ===== -->
      <div class="alarm-table-wrap">
        <table class="alarm-table">
          <thead>
            <tr>
              <th>级别</th>
              <th>设备名称</th>
              <th>告警内容</th>
              <th>发生时间</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="alarmTableBody">
            <tr><td colspan="6"><div class="empty-state"><p>加载中...</p></div></td></tr>
          </tbody>
        </table>
      </div>
      <!-- ===== 分页控件：上一页/下一页按钮及页码信息 ===== -->
      <div class="pagination" id="pagination" style="display:flex;justify-content:center;align-items:center;gap:12px;padding:14px 0 4px;font-size:13px;color:var(--text-secondary);">
        <button class="page-btn" id="prevPage" style="padding:4px 12px;border:1px solid var(--border-color);border-radius:6px;background:transparent;color:var(--text-secondary);cursor:pointer;">← 上一页</button>
        <span id="pageInfo">第 1 / 1 页</span>
        <button class="page-btn" id="nextPage" style="padding:4px 12px;border:1px solid var(--border-color);border-radius:6px;background:transparent;color:var(--text-secondary);cursor:pointer;">下一页 →</button>
      </div>
    </div>
  </main>

  <!-- ============================================================
       页面级 JavaScript
       引入公共模块后，在此定义告警页特有的筛选、加载、
       分页及导出逻辑。
       ============================================================ -->
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script>
    // ============================================================
    // 筛选状态管理：记录当前选中的级别、状态和设备筛选条件
    // ============================================================
    var currentLevel = 'all';
    var currentStatus = 'all';
    var currentEquipment = 'all';

    // ============================================================
    // 渲染告警统计摘要卡片（紧急/重要/一般/总计）
    // 参数 summary: { total, critical, major, minor }
    // ============================================================
    function renderSummary(summary) {
      var container = document.getElementById('alarmSummary');
      if (!summary || !summary.total) {
        container.innerHTML = '<div class="summary-item total"><span class="count">0</span><span class="label">暂无告警</span></div>';
        return;
      }
      // 渲染四种统计卡片：紧急/重要/一般/总计
      container.innerHTML =
        '<div class="summary-item critical"><span class="count">' + (summary.critical||0) +
        '</span><span class="label">🔴 紧急</span></div>' +
        '<div class="summary-item major"><span class="count">' + (summary.major||0) +
        '</span><span class="label">🟠 重要</span></div>' +
        '<div class="summary-item minor"><span class="count">' + (summary.minor||0) +
        '</span><span class="label">🟡 一般</span></div>' +
        '<div class="summary-item total"><span class="count">' + (summary.total||0) +
        '</span><span class="label">📋 总计</span></div>';
      // 统计卡片渲染完成后加载统计图表
      loadAlarmStats();
    }

    // ============================================================
    // 告警统计图表（级别分布饼图、设备排行柱状图、趋势堆叠图）
    // 依赖 ECharts
    // ============================================================

    var statsCharts = {};  // 统计图表实例缓存

    /**
     * 并行加载三个维度的统计数据
     */
    async function loadAlarmStats() {
      var panel = document.getElementById('statsPanel');
      if (!panel) return;
      panel.style.display = 'grid';
      try {
        // 并行加载按级别、按设备、按时间的统计
        var [byLevel, byDevice, byTime] = await Promise.all([
          getAlarmStatsByLevel(),
          getAlarmStatsByDevice(),
          getAlarmStatsByTime({ range: '30d' })
        ]);
        renderLevelChart(byLevel);
        renderDeviceChart(byDevice);
        renderTrendChart(byTime);
      } catch(e) { console.error('加载统计图表失败:', e); }
    }

    /**
     * 渲染告警级别分布饼图
     * @param {Object} data - { critical, warning, info } 数量
     */
    function renderLevelChart(data) {
      var dom = document.getElementById('levelChart');
      if (!dom) return;
      if (typeof echarts === 'undefined') { dom.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary);font-size:13px;">ECharts 未加载</div>'; return; }
      if (statsCharts.level) statsCharts.level.dispose();  // 销毁旧实例
      var chart = echarts.init(dom, 'dark');
      statsCharts.level = chart;
      chart.setOption({
        tooltip: { trigger:'item', formatter:'{b}: {c} ({d}%)' },
        series: [{
          type:'pie', radius:['40%','65%'], avoidLabelOverlap:false,
          label: { show:true, formatter:'{b}\n{d}%', color:'#8899bb', fontSize:10 },
          emphasis: { label:{ show:true, fontSize:14, fontWeight:'bold' } },
          data: [
            { value: data.critical||0, name:'紧急', itemStyle:{ color:'#ff1744' } },  // 紧急 → 红色
            { value: data.warning||0, name:'重要', itemStyle:{ color:'#ff9100' } },   // 重要 → 橙色
            { value: data.info||0, name:'一般', itemStyle:{ color:'#ffd740' } }       // 一般 → 黄色
          ]
        }]
      });
      chart.resize();
    }

    /**
     * 渲染告警设备排行柱状图（水平条形图，取前 5 名）
     * @param {Array} data - [{ equipment_name, alarm_count }]
     */
    function renderDeviceChart(data) {
      var dom = document.getElementById('deviceChart');
      if (!dom) return;
      if (typeof echarts === 'undefined') { return; }
      if (statsCharts.device) statsCharts.device.dispose();  // 销毁旧实例
      if (!data || data.length === 0) { dom.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary);font-size:13px;">暂无数据</div>'; return; }
      var chart = echarts.init(dom, 'dark');
      statsCharts.device = chart;
      var top5 = data.slice(0, 5);  // 只取前 5
      chart.setOption({
        tooltip: { trigger:'axis' },
        grid: { left:70, right:10, top:10, bottom:25 },
        xAxis: { type:'value', axisLabel:{ color:'#6a7588', fontSize:10 }, splitLine:{ lineStyle:{ color:'rgba(42,58,92,0.2)' } } },
        yAxis: { type:'category', data:top5.map(function(d){return d.equipment_name||'未知';}).reverse(), axisLabel:{ color:'#8899bb', fontSize:10 } },
        series: [{
          type:'bar', data:top5.map(function(d){return d.alarm_count;}).reverse(),
          itemStyle: { color:'#6C3FF5', borderRadius:[0,4,4,0] },  /* 紫色圆角柱状 */
          barMaxWidth: 20
        }]
      });
      chart.resize();
    }

    /**
     * 渲染告警趋势堆叠柱状图（按日期堆叠紧急/重要/一般）
     * @param {Array} data - [{ date, count, critical, warning }]
     */
    function renderTrendChart(data) {
      var dom = document.getElementById('trendChart');
      if (!dom) return;
      if (typeof echarts === 'undefined') { return; }
      if (statsCharts.trend) statsCharts.trend.dispose();
      if (!data || data.length === 0) { dom.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary);font-size:13px;">暂无趋势数据</div>'; return; }
      var chart = echarts.init(dom, 'dark');
      statsCharts.trend = chart;
      chart.setOption({
        tooltip: { trigger:'axis' },
        grid: { left:35, right:10, top:15, bottom:25 },
        xAxis: { type:'category', data:data.map(function(d){return d.date;}), axisLabel:{ color:'#6a7588', fontSize:9, rotate:30 } },
        yAxis: { type:'value', minInterval:1, splitLine:{ lineStyle:{ color:'rgba(42,58,92,0.2)' } }, axisLabel:{ color:'#6a7588', fontSize:10 } },
        series: [
          { name:'紧急', type:'bar', stack:'total', data:data.map(function(d){return d.critical||0;}), itemStyle:{ color:'#ff1744' }, barMaxWidth:12 },   /* 紧急 → 红色 */
          { name:'重要', type:'bar', stack:'total', data:data.map(function(d){return d.warning||0;}), itemStyle:{ color:'#ff9100' }, barMaxWidth:12 },   /* 重要 → 橙色 */
          { name:'一般', type:'bar', stack:'total', data:data.map(function(d){
            return (d.count||0) - (d.critical||0) - (d.warning||0);  /* 一般 = 总数 - 紧急 - 重要 */
          }), itemStyle:{ color:'#ffd740' }, barMaxWidth:12 }                                                              /* 一般 → 黄色 */
        ]
      });
      chart.resize();
    }

    // 窗口大小变化时重绘所有统计图表
    window.addEventListener('resize', function() {
      Object.values(statsCharts).forEach(function(c) { if (c && c.resize) c.resize(); });
    });

    // ============================================================
    // 渲染告警列表表格行，绑定确认/清除按钮事件
    // 参数 alarms: 告警对象数组
    // 根据角色显示不同的操作按钮：
    //   - 主管/管理员：确认 → 清除
    //   - 维修员：添加维修记录
    // ============================================================
    function renderAlarms(alarms) {
      var tbody = document.getElementById('alarmTableBody');
      var badge = document.getElementById('totalBadge');
      if (!badge) return;
      var isMaintTech = hasRole('maintenance_tech');          // 设备维修员
      var canConfirm = hasRole('workshop_supervisor') || hasRole('dashboard_admin');  // 有确认权限的角色

      badge.textContent = '共 ' + alarms.length + ' 条';

      if (alarms.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><div class="icon">✅</div><p>暂无告警记录</p></div></td></tr>';
        return;
      }

      tbody.innerHTML = alarms.map(function(alarm) {
        var levelClass = alarm.level;
        var statusClass = alarm.status;
        var isActive = alarm.status === 'active';
        var isConfirmed = alarm.status === 'confirmed';

        var actions = '';
        // 车间主管/看板管理员：可确认/清除告警
        if (canConfirm) {
          if (isActive) {
            actions = '<button class="action-btn confirm" data-id="' + alarm.id + '">确认</button>';
          } else if (isConfirmed) {
            actions = '<button class="action-btn clear" data-id="' + alarm.id + '">清除</button>';
          } else {
            actions = '<span style="color:var(--text-secondary);font-size:12px;">已处理</span>';
          }
        }
        // 设备维修员：添加维修记录按钮（仅维修员，无确认/清除权限）
        if (isMaintTech && (isActive || isConfirmed)) {
          actions += '<button class="maintenance-btn maint-record-btn" data-id="' + alarm.id +
            '" data-equipment="' + (alarm.equipmentId || '') +
            '" data-equip-name="' + (alarm.equipmentName || '') +
            '" data-content="' + (alarm.content || '') +
            '">🔧 维修</button>';
        }
        // 没有任何操作按钮时显示横线
        if (!actions) {
          actions = '<span style="color:var(--text-muted);font-size:12px;">--</span>';
        }

        return '<tr>' +
          '<td><span class="level-tag ' + levelClass + '">' + (alarm.levelText || alarm.level) + '</span></td>' +
          '<td><strong>' + (alarm.equipmentName || '--') + '</strong></td>' +
          '<td>' + (alarm.content || '--') + '</td>' +
          '<td>' + (alarm.occurredAt ? formatDate(alarm.occurredAt) : '--') + '</td>' +
          '<td><span class="status-tag ' + statusClass + '">' + getAlarmStatusText(alarm.status) + '</span></td>' +
          '<td>' + actions + '</td>' +
          '</tr>';
      }).join('');

      // 绑定确认/清除按钮事件
      tbody.querySelectorAll('.action-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          var id = parseInt(this.dataset.id);
          var action = this.classList.contains('confirm') ? 'confirm' : 'clear';
          handleAlarmAction(id, action);
        });
      });
      // 绑定维修记录按钮事件
      tbody.querySelectorAll('.maint-record-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          openMaintModal({
            alarmId: parseInt(this.dataset.id),
            equipmentId: parseInt(this.dataset.equipment) || 0,
            equipmentName: this.dataset.equipName,
            content: this.dataset.content
          });
        });
      });
    }

    // ============================================================
    // 处理告警确认/清除操作，弹出提示框输入操作人姓名
    // ============================================================
    async function handleAlarmAction(id, action) {
      var handler = prompt('请输入操作人姓名：', '管理员');
      if (!handler) return;

      try {
        if (action === 'confirm') {
          await confirmAlarm(id, handler);  // 确认告警
        } else {
          await clearAlarm(id, handler);    // 清除告警
        }
        loadAlarms();  // 刷新列表
      } catch (error) {
        alert('操作失败：' + error.message);
      }
    }

    // ============================================================
    // 加载设备列表，填充到筛选下拉框（供按设备筛选使用）
    // ============================================================
    async function loadEquipmentFilter() {
      try {
        var list = await getEquipment();
        var select = document.getElementById('equipmentFilter');
        select.innerHTML = '<option value="all">全部设备</option>';
        (list || []).forEach(function(equip) {
          select.innerHTML += '<option value="' + equip.id + '">' + equip.name + '</option>';
        });
      } catch (error) {
        console.error('加载设备列表失败:', error);
      }
    }

    // ============================================================
    // 加载告警数据（支持筛选和分页）
    // 兼容后端返回纯数组或分页对象两种数据格式
    // 包含分页参数修复：将事件对象等非法参数兜底转换为第 1 页
    // ============================================================
    var previousAlarmCount = 0;   // 上次告警总数，用于检测新告警
    var currentPage = 1;
    var totalPages = 1;

    /**
     * 加载告警数据
     * @param {number|Event} page - 目标页码或事件对象
     * 
     * 【Bug 修复】：强制类型转换为安全整数
     * 当 loadAlarms 被直接用作事件回调（refresh / setInterval）时,
     * page 会接收到事件对象（如 PointerEvent），导致 currentPage 被赋值为对象,
     * 最终传给后端的 page 参数变成 "[object PointerEvent]"，引发 SQLite 类型不匹配错误。
     */
    async function loadAlarms(page) {
      var parsedPage = parseInt(page);
      if (!isNaN(parsedPage) && parsedPage >= 1) {
        currentPage = parsedPage;
      } else {
        currentPage = 1; // 兜底：非法值（事件对象、NaN、<1）时回到第 1 页
      }
      try {
        var params = { limit: 10, page: currentPage };
        if (currentLevel !== 'all') params.level = currentLevel;          // 按级别筛选
        if (currentStatus !== 'all') params.status = currentStatus;       // 按状态筛选
        if (currentEquipment !== 'all') params.equipmentId = currentEquipment;  // 按设备筛选

        var result = await getAlarms(params);

        // 【核心兼容补丁】：兼容后端返回纯数组和分页对象两种情况
        var list = [];
        var summary = { total: 0, critical: 0, major: 0, minor: 0 };

        if (Array.isArray(result)) {
          // 情况1：后端返回的是一个纯数组列表
          list = result;
          summary.total = list.length;
        } else if (result && typeof result === 'object') {
          // 情况2：后端返回的是 { list: [], summary: {} } 的分页对象
          list = result.list || [];
          summary = result.summary || summary;
        }

        renderSummary(summary);                 // 渲染统计摘要
        renderAlarms(list);                      // 渲染告警表格
        window._alarmTableData = list;           // 暴露给导出按钮使用

        // 更新侧边栏告警徽章
        var activeCount = (summary.critical || 0) + (summary.major || 0);
        var badge = document.getElementById('alarmBadge');
        if (badge) {
          badge.textContent = activeCount;
          badge.style.display = activeCount > 0 ? 'inline' : 'none';
        }

        // 标签页闪烁：检测新告警
        if (typeof checkNewAlarms === 'function') {
          checkNewAlarms(previousAlarmCount, (summary.total || 0));
        }
        previousAlarmCount = summary.total || 0;

        // 更新分页信息
        totalPages = Math.max(1, Math.ceil((summary.total || 0) / 10));
        document.getElementById('pageInfo').textContent = '第 ' + (parseInt(currentPage) || 1) + ' / ' + (parseInt(totalPages) || 1) + ' 页';
        document.getElementById('prevPage').disabled = currentPage <= 1;
        document.getElementById('nextPage').disabled = currentPage >= totalPages;

      } catch (error) {
        console.error('加载告警失败:', error);
        document.getElementById('alarmTableBody').innerHTML =
          '<tr><td colspan="6"><div class="empty-state"><p>❌ 加载失败</p></div></td></tr>';
      }
      if (typeof window.__loaderMarkApiReady === 'function') window.__loaderMarkApiReady();  // 标记数据加载完成
    }

    // ============================================================
    // 维修记录弹窗控制（设备维修员使用）
    // 弹窗包含：告警信息、故障描述、原因、更换零件、费用、历史
    // ============================================================
    var currentMaintAlarm = null;

    /**
     * 打开维修记录弹窗
     * @param {Object} alarm - { alarmId, equipmentId, equipmentName, content }
     * 预填告警内容，加载该告警的已有维修历史
     */
    function openMaintModal(alarm) {
      currentMaintAlarm = alarm;
      // 显示告警信息头
      document.getElementById('maintAlarmInfo').innerHTML =
        '<strong>告警：</strong>' + (alarm.equipmentName || '--') + ' — ' + (alarm.content || '--') +
        ' <span style="color:var(--text-muted);font-size:11px;">(设备ID: ' + (alarm.equipmentId || '--') + ')</span>';
      // 重置表单字段
      document.getElementById('maint_desc').value = alarm.content || '';
      document.getElementById('maint_cause').value = '';
      document.getElementById('maint_parts').value = '';
      document.getElementById('maint_cost').value = '0';
      document.getElementById('maint_notes').value = '';
      document.getElementById('submitMaintBtn').disabled = false;
      document.getElementById('submitMaintBtn').textContent = '提交维修记录';

      // 加载已有维修历史
      getAlarmMaintenance(alarm.alarmId).then(function(list) {
        var histDiv = document.getElementById('maintHistory');
        if (list && list.length > 0) {
          histDiv.style.display = 'block';
          histDiv.innerHTML = '<div style="font-size:12px;font-weight:600;margin-bottom:6px;color:var(--text-primary);">📋 维修历史</div>' +
            list.map(function(m) {
              return '<div class="maint-history-item">' +
                '<div><strong>' + (m.description || '--') + '</strong></div>' +
                '<div>故障原因: ' + (m.fault_cause || '--') + ' | 更换零件: ' + (m.parts_replaced || '--') +
                ' | 费用: ¥' + (m.cost || 0) +
                ' | 状态: ' + ({pending:'待处理',in_progress:'维修中',completed:'已完成'}[m.status]||m.status) +
                '</div></div>';
            }).join('');
        } else {
          histDiv.style.display = 'none';
        }
      }).catch(function() {});

      document.getElementById('maintModal').style.display = 'flex';
    }

    /**
     * 关闭维修记录弹窗
     */
    function closeMaintModal() {
      document.getElementById('maintModal').style.display = 'none';
      currentMaintAlarm = null;
    }

    /**
     * 提交维修记录到后端
     * 校验故障描述必填，调用 createMaintenanceFromAlarm API
     */
    async function submitMaintenance() {
      if (!currentMaintAlarm) return;
      var desc = document.getElementById('maint_desc').value.trim();
      var cause = document.getElementById('maint_cause').value;
      var parts = document.getElementById('maint_parts').value.trim();
      var cost = parseFloat(document.getElementById('maint_cost').value) || 0;
      var notes = document.getElementById('maint_notes').value.trim();

      if (!desc) { alert('请输入故障描述'); return; }

      var btn = document.getElementById('submitMaintBtn');
      btn.disabled = true;
      btn.textContent = '提交中...';

      try {
        await createMaintenanceFromAlarm({
          alarm_id: currentMaintAlarm.alarmId,
          equipment_id: currentMaintAlarm.equipmentId,
          technician_id: 1,  // 默认使用第一个技术人员ID
          description: desc,
          fault_cause: cause,
          parts_replaced: parts,
          cost: cost,
          notes: notes
        });
        closeMaintModal();
        loadAlarms();  // 刷新告警列表
        showToast && showToast('✅ 维修记录已提交');
      } catch (e) {
        alert('提交失败: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '提交维修记录';
      }
    }

    // ============================================================
    // 初始化：时钟、筛选器、分页按钮事件、刷新按钮、
    // 首次加载告警数据、每 60 秒自动刷新、导出 CSV 功能
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      // 基础组件
      initClock();
      //initSidebar();

      // 加载设备筛选
      loadEquipmentFilter();

      // 筛选事件
      document.getElementById('levelFilter').addEventListener('change', function() {
        currentLevel = this.value;
        loadAlarms();
      });
      document.getElementById('statusFilter').addEventListener('change', function() {
        currentStatus = this.value;
        loadAlarms();
      });
      document.getElementById('equipmentFilter').addEventListener('change', function() {
        currentEquipment = this.value;
        loadAlarms();
      });

      // ===== 分页按钮 =====
      document.getElementById('prevPage').addEventListener('click', function() {
        if (currentPage > 1) loadAlarms(currentPage - 1);
      });
      document.getElementById('nextPage').addEventListener('click', function() {
        if (currentPage < totalPages) loadAlarms(currentPage + 1);
      });

      // 刷新按钮
      document.getElementById('refreshAlarmsBtn').addEventListener('click', loadAlarms);
      document.getElementById('refreshBtn').addEventListener('click', loadAlarms);

      // 加载告警数据
      loadAlarms();

      // 每60秒自动刷新
      var sysInterval = parseInt(localStorage.getItem('dashboard_refreshInterval')) || 60000;
      setInterval(loadAlarms, sysInterval);

      // ===== 导出 CSV：将当前告警列表数据导出为 CSV 文件 =====
      document.getElementById('exportBtn').addEventListener('click', function() {
        var list = window._alarmTableData || [];
        if (list.length === 0) { alert('暂无数据可导出'); return; }
        var cols = [
          { key: 'level', label: '级别' },
          { key: 'equipmentName', label: '设备名称' },
          { key: 'content', label: '告警内容' },
          { key: 'occurredAt', label: '发生时间' },
          { key: 'status', label: '状态' }
        ];
        var exportData = list.map(function(item) {
          return {
            level: getLevelText ? getLevelText(item.level) : item.level,
            equipmentName: item.equipmentName,
            content: item.content,
            occurredAt: item.occurredAt ? formatDate(item.occurredAt) : '',
            status: getAlarmStatusText ? getAlarmStatusText(item.status) : item.status
          };
        });
        if (typeof exportToCSV === 'function') exportToCSV(exportData, cols, '告警记录');
      });
    });

  </script>

  <!-- ============================================================
       维修记录弹窗（设备维修员使用）
       ============================================================ -->
  <div id="maintModal" style="display:none;position:fixed;inset:0;z-index:99998;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;" onclick="if(event.target===this)closeMaintModal()">
    <div style="background:var(--bg-card,#141b2d);border:1px solid var(--border-color,#1e293b);border-radius:12px;padding:24px;width:90%;max-width:520px;box-shadow:0 8px 32px rgba(0,0,0,0.4);max-height:90vh;overflow-y:auto;" onclick="event.stopPropagation()">
      <h3 style="margin:0 0 16px;font-size:16px;display:flex;align-items:center;gap:8px;"><i class="fas fa-tools" style="color:#6C3FF5;"></i> 记录维修过程</h3>
      <div id="maintAlarmInfo" style="font-size:12px;color:var(--text-secondary);padding:8px 12px;background:var(--bg-secondary,#0f172a);border-radius:6px;margin-bottom:14px;"></div>
      <div class="maint-form-group">
        <label>故障描述</label>
        <textarea id="maint_desc" placeholder="描述故障现象..."></textarea>
      </div>
      <div class="maint-form-group">
        <label>故障原因</label>
        <select id="maint_cause">
          <option value="">-- 请选择 --</option>
          <option value="机械磨损">机械磨损</option>
          <option value="电气故障">电气故障</option>
          <option value="软件异常">软件异常</option>
          <option value="传感器故障">传感器故障</option>
          <option value="人为操作失误">人为操作失误</option>

        <div class="maint-form-group">
          <label>维修费用（元）</label>
          <input id="maint_cost" type="number" placeholder="0" value="0">

      <div class="maint-form-group">
        <label>备注</label>
        <textarea id="maint_notes" placeholder="其他需要记录的信息..."></textarea>

      <div style="display:flex;gap:10px;margin-top:16px;">
        <button onclick="closeMaintModal()" style="flex:1;padding:10px;border:1px solid var(--border-color,#1e293b);border-radius:8px;background:transparent;color:var(--text-secondary,#8899bb);cursor:pointer;font-size:14px;">取消</button>
        <button id="submitMaintBtn" onclick="submitMaintenance()" style="flex:1;padding:10px;border:none;border-radius:8px;background:#6C3FF5;color:#fff;cursor:pointer;font-size:14px;font-weight:600;">提交维修记录</button>
      </div>
